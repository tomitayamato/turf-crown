function f18(n){ return n||'-'; }

/* =====================================================================
   コース描画 ＋ レース再生
   ===================================================================== */

/* ---------- 脚質のレーダーチャート ----------
   4能力の抽選範囲を帯で、中心値を実線で描く。能力の「形」が一目で分かる。
*/
function drawStyleRadar(cv, styleKey){
  if(!cv) return;
  var g=cv.getContext('2d'), W=cv.width, H=cv.height;
  var cx=W/2, cy=H/2, R=118, MAXV=72;
  var st=STYLES[styleKey], col=st.color, i;
  var AX=[['speed',-Math.PI/2],['power',0],['stamina',Math.PI/2],['skill',Math.PI]];
  g.clearRect(0,0,W,H);
  function pt(a,v){ var r=R*Math.min(1,v/MAXV); return [cx+Math.cos(a)*r, cy+Math.sin(a)*r]; }
  function poly(vals){
    g.beginPath();
    for(var j=0;j<4;j++){ var p=pt(AX[j][1], vals[j]); j?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]); }
    g.closePath();
  }
  /* 目盛り */
  for(var ring=1;ring<=4;ring++){
    var rr=R*ring/4;
    g.beginPath();
    for(i=0;i<4;i++){ var a=AX[i][1], x=cx+Math.cos(a)*rr, y=cy+Math.sin(a)*rr; i?g.lineTo(x,y):g.moveTo(x,y); }
    g.closePath();
    g.strokeStyle = ring===4 ? 'rgba(255,255,255,.20)' : 'rgba(255,255,255,.07)';
    g.lineWidth=2; g.stroke();
  }
  g.strokeStyle='rgba(255,255,255,.10)'; g.lineWidth=2;
  for(i=0;i<4;i++){ g.beginPath(); g.moveTo(cx,cy);
    g.lineTo(cx+Math.cos(AX[i][1])*R, cy+Math.sin(AX[i][1])*R); g.stroke(); }

  /* 抽選範囲の帯（最大の多角形から最小の多角形をくり抜く） */
  var mx=[], mn=[], ct=[];
  for(i=0;i<4;i++){
    var rg=st.range[AX[i][0]];
    mx.push(rg[1]); mn.push(rg[0]); ct.push((rg[0]+rg[1])/2);
  }
  g.beginPath();
  for(i=0;i<4;i++){ var p1=pt(AX[i][1], mx[i]); i?g.lineTo(p1[0],p1[1]):g.moveTo(p1[0],p1[1]); }
  g.closePath();
  for(i=0;i<4;i++){ var p2=pt(AX[i][1], mn[i]); i?g.lineTo(p2[0],p2[1]):g.moveTo(p2[0],p2[1]); }
  g.closePath();
  g.fillStyle=col+'4d'; g.fill('evenodd');
  g.beginPath();
  for(i=0;i<4;i++){ var p3=pt(AX[i][1], mx[i]); i?g.lineTo(p3[0],p3[1]):g.moveTo(p3[0],p3[1]); }
  g.closePath();
  g.strokeStyle=col+'66'; g.lineWidth=1.5; g.setLineDash([5,4]); g.stroke(); g.setLineDash([]);

  /* 中心値 */
  poly(ct);
  g.fillStyle=col+'26'; g.fill();
  g.strokeStyle=col; g.lineWidth=3; g.lineJoin='round'; g.stroke();
  for(i=0;i<4;i++){
    var pc=pt(AX[i][1], ct[i]);
    g.beginPath(); g.arc(pc[0],pc[1],5.5,0,7);
    g.fillStyle=col; g.fill();
    g.strokeStyle='#16271e'; g.lineWidth=2; g.stroke();
  }

  /* 軸名 */
  g.font='bold 20px -apple-system,"Hiragino Sans",sans-serif';
  g.fillStyle='rgba(234,242,236,.88)'; g.textBaseline='middle';
  g.textAlign='center'; g.fillText('走力', cx, 17);
  g.fillText('スタミナ', cx, H-17);
  g.textAlign='right';  g.fillText('パワー', W-3, cy);
  g.textAlign='left';   g.fillText('器用さ', 3, cy);
}

/* ---------- コース全体図の形を作る ---------- */
function buildLoopPath(c){
  if(c._path) return c._path;
  var ang = c.turn==='R' ? 1 : -1;
  var h   = c.turn==='R' ? Math.PI : 0;   /* 右回りはスタンド前を右→左へ */
  var x=0, y=0, pts=[[0,0]], accum=[0], total=0, i, j;
  for(i=0;i<c.loop.length;i++){
    var kind=c.loop[i][0], len=c.loop[i][1];
    var n=Math.max(3, Math.round(len/8));
    var step=len/n, draw=(kind==='C'? len*1.75 : len)/n;
    for(j=0;j<n;j++){
      if(kind==='C') h += ang*(Math.PI/2)/n;
      x += Math.cos(h)*draw; y += Math.sin(h)*draw;
      total += step; pts.push([x,y]); accum.push(total);
    }
  }
  /* 誤差を全体に薄く分配して閉じる */
  var gx=pts[0][0]-pts[pts.length-1][0], gy=pts[0][1]-pts[pts.length-1][1];
  for(i=0;i<pts.length;i++){
    var r=i/(pts.length-1);
    pts[i][0]+=gx*r; pts[i][1]+=gy*r;
  }
  var minx=1e9,maxx=-1e9,miny=1e9,maxy=-1e9;
  for(i=0;i<pts.length;i++){
    if(pts[i][0]<minx)minx=pts[i][0]; if(pts[i][0]>maxx)maxx=pts[i][0];
    if(pts[i][1]<miny)miny=pts[i][1]; if(pts[i][1]>maxy)maxy=pts[i][1];
  }
  c._path = {pts:pts, accum:accum, total:total,
    minx:minx, maxx:maxx, miny:miny, maxy:maxy, w:maxx-minx, h:maxy-miny};
  return c._path;
}
/* レース上の距離 d → コース全体図の座標（0-1正規化） */
function loopPointAt(c, d){
  var P=buildLoopPath(c);
  var lp = ((c.startLapPos + d) % c.lapLength + c.lapLength) % c.lapLength;
  var t  = lp / c.lapLength * P.total;
  var lo=0, hi=P.accum.length-1;
  while(lo<hi-1){ var mid=(lo+hi)>>1; if(P.accum[mid]<=t) lo=mid; else hi=mid; }
  var a=P.pts[lo], b=P.pts[hi];
  var r=(t-P.accum[lo])/((P.accum[hi]-P.accum[lo])||1);
  return [a[0]+(b[0]-a[0])*r, a[1]+(b[1]-a[1])*r];
}

/* ---------- コース全体図 ---------- */
function drawMiniMap(cv, c, state, me, scale){
  var g=cv.getContext('2d'), W=cv.width, H=cv.height;
  var P=buildLoopPath(c), pad=18*(scale||1);
  g.clearRect(0,0,W,H);
  var s=Math.min((W-pad*2)/P.w, (H-pad*2-10)/P.h);
  var ox=(W-P.w*s)/2-P.minx*s, oy=(H-P.h*s)/2-P.miny*s+3;
  function px(p){ return [p[0]*s+ox, p[1]*s+oy]; }

  /* コース */
  g.lineCap='round'; g.lineJoin='round';
  g.strokeStyle='#1d3327'; g.lineWidth=13*(scale?1:1.6);
  g.beginPath();
  for(var i=0;i<P.pts.length;i++){ var q=px(P.pts[i]); i?g.lineTo(q[0],q[1]):g.moveTo(q[0],q[1]); }
  g.closePath(); g.stroke();
  g.strokeStyle='#2d5c42'; g.lineWidth=9*(scale?1:1.6); g.stroke();

  /* ゴール板 */
  var gp=px(loopPointAt(c, c.distance));
  g.fillStyle='#e8c268';
  g.beginPath(); g.arc(gp[0],gp[1],5.5,0,7); g.fill();
  g.font='bold '+(scale?13:17)+'px sans-serif'; g.fillStyle='#e8c268';
  g.textAlign='center'; g.fillText('GOAL', gp[0], gp[1]-11);

  /* スタート */
  var sp=px(loopPointAt(c, 0));
  g.fillStyle='#9fb6a8'; g.beginPath(); g.arc(sp[0],sp[1],4,0,7); g.fill();
  g.font=(scale?11:15)+'px sans-serif'; g.fillStyle='#9fb6a8';
  g.fillText('START', sp[0], sp[1]+(scale?17:22));

  if(!state) return;

  /* 馬群（最後方→先頭をなぞる） */
  var lead=state.lead, last=state.last;
  if(lead>0){
    g.strokeStyle='rgba(190,232,205,.55)'; g.lineWidth=5; g.lineCap='round';
    g.beginPath();
    var n=14;
    for(var k=0;k<=n;k++){
      var dd=last+(lead-last)*k/n;
      var qq=px(loopPointAt(c, dd));
      k?g.lineTo(qq[0],qq[1]):g.moveTo(qq[0],qq[1]);
    }
    g.stroke();
  }
  /* 先頭 */
  var lp=px(loopPointAt(c, lead));
  g.fillStyle='#ffffff'; g.beginPath(); g.arc(lp[0],lp[1],6,0,7); g.fill();
  g.strokeStyle='#0c1511'; g.lineWidth=1.6; g.stroke();
  /* 自分 */
  if(me!=null){
    var mp=px(loopPointAt(c, me));
    g.fillStyle='#ffd45e'; g.beginPath(); g.arc(mp[0],mp[1],7.5,0,7); g.fill();
    g.strokeStyle='#0c1511'; g.lineWidth=2; g.stroke();
    g.font='bold 12px sans-serif'; g.fillStyle='#ffd45e'; g.textAlign='center';
    g.fillText('自分', mp[0], mp[1]+20);
  }
}

/* ---------- 高低図（出走表用） ---------- */
function drawElev(cv, c){
  var g=cv.getContext('2d'), W=cv.width, H=cv.height, lut=buildCourseLUT(c);
  g.clearRect(0,0,W,H);
  var padL=28, padR=28, top=24, bot=26;
  var lo=lut.elevMin, hi=lut.elevMax, rng=Math.max(1.2, hi-lo);
  function X(d){ return padL+(d/c.distance)*(W-padL-padR); }
  function Y(d){ return top+(1-(lut.elev[Math.min(d|0,c.distance|0)]-lo)/rng)*(H-top-bot); }

  /* 芝 */
  g.beginPath(); g.moveTo(padL,H-bot);
  for(var d=0;d<=c.distance;d+=10) g.lineTo(X(d),Y(d));
  g.lineTo(W-padR,H-bot); g.closePath();
  var gr=g.createLinearGradient(0,top,0,H-bot);
  gr.addColorStop(0,'#2a6344'); gr.addColorStop(1,'#15301f');
  g.fillStyle=gr; g.fill();
  g.strokeStyle='#7ee0a0'; g.lineWidth=2.4; g.beginPath();
  for(var d2=0;d2<=c.distance;d2+=10){ d2?g.lineTo(X(d2),Y(d2)):g.moveTo(X(d2),Y(d2)); }
  g.stroke();

  /* コーナー帯 */
  for(var d3=0;d3<c.distance;d3+=20){
    var ct=lut.corner[d3|0];
    if(ct>0.25){ g.fillStyle='rgba(232,194,104,'+(ct*0.16)+')'; g.fillRect(X(d3),top,X(d3+20)-X(d3),H-top-bot); }
  }
  g.font='13px sans-serif'; g.textAlign='center';
  g.fillStyle='#9fb6a8'; g.fillText('START', padL, H-8);
  g.fillStyle='#e8c268'; g.fillText('GOAL', W-padR, H-8);
  g.fillStyle='#6f8a7b'; g.textAlign='left';
  g.fillText('高低差 '+(hi-lo).toFixed(1)+'m', padL+2, 15);
  g.textAlign='right'; g.fillText('黄色の帯＝コーナー', W-padR-2, 15);
}

/* ---------- 直線に伸ばしたコース（レース本番） ----------
   コース全体を一画面に収めると60mの着差が画面の2〜3%にしかならず馬群が点になる。
   そこで馬群の周辺だけを切り取って映し、直線では窓をさらに狭めて競り合いに寄る。
   上段は高低差のガイド、下段が走路（馬は平らなレーンを走る）。
   コース全体のどこを走っているかは下端の進行バーで示す。
*/
function drawTrack(cv, c, pos, meIdx, field, view, remText, lanes, spd){
  var g=cv.getContext('2d'), W=cv.width, H=cv.height, lut=buildCourseLUT(c), i, d, L;
  var padL=28, padR=28, IW=W-padL-padR, D=c.distance;
  var headH=38, barH=16, rest=H-headH-barH;
  var eTop=headH+4, eBot=headH+rest*0.26;
  var bTop=eBot+19, bBot=H-8;
  var viewA=view.a, viewB=view.b, span=viewB-viewA, zoom=false;
  function X(dd){ return padL+(dd-viewA)/span*IW; }
  var lo=lut.elevMin, hi=lut.elevMax, rng=Math.max(1.2,hi-lo);
  function EY(dd){ var k=dd<0?0:(dd>D?D:dd|0); return eTop+(1-(lut.elev[k]-lo)/rng)*(eBot-eTop); }
  function laneY(n){ return bTop+36+n*((bBot-bTop-58)/2); }

  g.clearRect(0,0,W,H);
  g.fillStyle='#0a120e'; g.fillRect(0,0,W,H);

  /* ===== 高低差ガイド：コース全体を表示し、現在位置を示す ===== */
  var lead=0, last=1e9;
  for(i=0;i<pos.length;i++){ if(pos[i]>lead) lead=pos[i]; if(pos[i]<last) last=pos[i]; }
  var leadG = lead>D ? D : lead, meG = pos[meIdx]>D ? D : pos[meIdx];
  function GX(dd){ return padL+(dd/D)*IW; }
  var stp=D/180;
  g.beginPath(); g.moveTo(padL,eBot);
  for(d=0;d<=D;d+=stp) g.lineTo(GX(d),EY(d));
  g.lineTo(W-padR,eBot); g.closePath();
  var gr=g.createLinearGradient(0,eTop,0,eBot);
  gr.addColorStop(0,'rgba(50,120,82,.42)'); gr.addColorStop(1,'rgba(16,46,30,.15)');
  g.fillStyle=gr; g.fill();
  /* 走り終えた区間を塗る */
  g.save();
  g.beginPath(); g.rect(padL,eTop-4,Math.max(0,GX(leadG)-padL),eBot-eTop+4); g.clip();
  g.beginPath(); g.moveTo(padL,eBot);
  for(d=0;d<=D;d+=stp) g.lineTo(GX(d),EY(d));
  g.lineTo(W-padR,eBot); g.closePath();
  g.fillStyle='rgba(99,196,140,.30)'; g.fill();
  g.restore();
  g.strokeStyle='rgba(143,240,178,.85)'; g.lineWidth=2; g.beginPath();
  var fst=true;
  for(d=0;d<=D;d+=stp){ if(fst){g.moveTo(GX(d),EY(d));fst=false;} else g.lineTo(GX(d),EY(d)); }
  g.stroke();
  /* 走路に映っている範囲 */
  g.fillStyle='rgba(232,194,104,.07)';
  g.fillRect(GX(Math.max(0,viewA)),eTop-2,GX(Math.min(D,viewB))-GX(Math.max(0,viewA)),eBot-eTop+2);
  /* 先頭と自分 */
  var gIdx=leadG<0?0:(leadG|0), grade=lut.grade[gIdx];
  g.strokeStyle='rgba(255,255,255,.35)'; g.lineWidth=1.5;
  g.beginPath(); g.moveTo(GX(leadG),eTop-2); g.lineTo(GX(leadG),eBot); g.stroke();
  g.fillStyle='#ffffff'; g.beginPath(); g.arc(GX(leadG),EY(leadG),4,0,7); g.fill();
  g.fillStyle='#ffd45e'; g.beginPath(); g.arc(GX(meG),EY(meG),5.5,0,7); g.fill();
  g.strokeStyle='#0c1511'; g.lineWidth=1.6; g.stroke();
  /* 目盛り */
  g.font='10px sans-serif'; g.fillStyle='rgba(159,182,168,.5)';
  g.textAlign='left';  g.fillText('スタート', padL, eBot+12);
  g.textAlign='right'; g.fillText('ゴール', W-padR, eBot+12);
  g.textAlign='left';  g.fillStyle='rgba(159,182,168,.55)';
  g.fillText('高低差ガイド', padL+2, eTop+12);
  if(grade>0.55){ g.fillStyle='#f0a05a'; g.textAlign='right'; g.fillText('↗ 上り坂', W-padR-2, eTop+12); }
  else if(grade<-0.55){ g.fillStyle='#6fc2e8'; g.textAlign='right'; g.fillText('↘ 下り坂', W-padR-2, eTop+12); }

  /* ===== 走路 ===== */
  var bh=bBot-bTop;
  var turf=g.createLinearGradient(0,bTop,0,bBot);
  turf.addColorStop(0,'#10251a'); turf.addColorStop(0.5,'#183828'); turf.addColorStop(1,'#1f4a33');
  g.fillStyle=turf; g.fillRect(padL-8,bTop,IW+16,bh);

  /* 芝の刈り目（コース位置に固定されているので流れて見える） */
  var stripe=26, s0=Math.floor(viewA/stripe)*stripe;
  for(d=s0; d<viewB+stripe; d+=stripe){
    if((Math.round(d/stripe)&1)===0) continue;
    var sx1=Math.max(padL-8,X(d)), sx2=Math.min(W-padR+8,X(d+stripe));
    if(sx2<=sx1) continue;
    g.fillStyle='rgba(255,255,255,.022)'; g.fillRect(sx1,bTop,sx2-sx1,bh);
  }
  /* コーナー帯 */
  var cs=span/90;
  for(d=viewA; d<viewB; d+=cs){
    if(d<0||d>D) continue;
    var ct=lut.corner[d|0];
    if(ct>0.25){ g.fillStyle='rgba(232,194,104,'+(ct*0.11)+')'; g.fillRect(X(d),bTop,X(d+cs)-X(d)+1,bh); }
  }
  /* ハロン棒 */
  g.font='11px sans-serif'; g.textAlign='center';
  for(var r=200;r<D;r+=200){
    var dd=D-r;
    if(dd<viewA||dd>viewB) continue;
    g.strokeStyle='rgba(255,255,255,.16)'; g.lineWidth=1;
    g.beginPath(); g.moveTo(X(dd),bTop+2); g.lineTo(X(dd),bBot-2); g.stroke();
    g.fillStyle='rgba(255,255,255,.42)'; g.fillText(r+'m', X(dd), bTop+14);
  }
  /* 目印 */
  for(i=0;i<c.marks.length;i++){
    var m=c.marks[i];
    if(m[0]<viewA||m[0]>viewB) continue;
    g.strokeStyle='rgba(232,194,104,.5)'; g.setLineDash([5,5]); g.lineWidth=1.5;
    g.beginPath(); g.moveTo(X(m[0]),bTop+2); g.lineTo(X(m[0]),bBot-2); g.stroke(); g.setLineDash([]);
  }
  /* コース幅のガイド（内ラチからの距離） */
  g.setLineDash([3,6]); g.lineWidth=1;
  for(var q=1;q<=3;q++){
    var qy=bBot-2-(bh-6)*q/4;
    g.strokeStyle='rgba(255,255,255,.07)';
    g.beginPath(); g.moveTo(padL-8,qy); g.lineTo(W-padR+8,qy); g.stroke();
  }
  g.setLineDash([]);
  /* 外ラチ（上）と内ラチ（下） */
  g.strokeStyle='rgba(255,255,255,.14)'; g.lineWidth=1.5;
  g.beginPath(); g.moveTo(padL-8,bTop+1.5); g.lineTo(W-padR+8,bTop+1.5); g.stroke();
  g.strokeStyle='rgba(255,255,255,.7)'; g.lineWidth=2.5;
  g.beginPath(); g.moveTo(padL-8,bBot-2); g.lineTo(W-padR+8,bBot-2); g.stroke();
  g.font='10px sans-serif'; g.textAlign='left'; g.fillStyle='rgba(255,255,255,.3)';
  g.fillText('外', padL-4, bTop+13);
  g.fillText('内', padL-4, bBot-8);
  var post=20, p0=Math.floor(viewA/post)*post;
  g.strokeStyle='rgba(255,255,255,.34)'; g.lineWidth=1.5;
  for(d=p0; d<viewB+post; d+=post){
    var px=X(d); if(px<padL-8||px>W-padR+8) continue;
    g.beginPath(); g.moveTo(px,bBot-2); g.lineTo(px,bBot-9); g.stroke();
  }

  /* スタート / ゴール */
  if(viewA<=0){
    var sx=X(0);
    g.fillStyle='rgba(10,18,14,.85)'; g.strokeStyle='#5f8f71'; g.lineWidth=2;
    g.fillRect(sx-24,bTop,24,bh); g.strokeRect(sx-24,bTop,24,bh);
    g.fillStyle='#c6dbcc'; g.font='bold 12px sans-serif'; g.textAlign='center';
    wtext(g,'スタート',sx-12,bTop+22,13);
  }
  if(viewB>=D){
    var gx=X(D);
    g.strokeStyle='#e8c268'; g.lineWidth=3;
    g.beginPath(); g.moveTo(gx,bTop-2); g.lineTo(gx,bBot); g.stroke();
    g.fillStyle='#2a1f08'; g.strokeStyle='#e8c268'; g.lineWidth=2.5;
    g.fillRect(gx+2,bTop-6,24,bh+10); g.strokeRect(gx+2,bTop-6,24,bh+10);
    g.fillStyle='#e8c268'; g.font='bold 13px sans-serif'; g.textAlign='center';
    wtext(g,'ゴール',gx+14,bTop+16,14);
  }

  /* ===== 見出し ===== */
  g.textAlign='left'; g.font='bold 18px sans-serif'; g.fillStyle='#e8c268';
  g.fillText(remText, padL, 26);
  if((D-lead) < c.straight){
    g.textAlign='right'; g.font='bold 12px sans-serif'; g.fillStyle='#e8c268';
    g.fillText('― 最後の直線 ―', W-padR, 26);
  }

  /* ===== 馬（内ラチからの位置どりを再現） ===== */
  var innerY=bBot-15, outerY=bTop+17, laneH=innerY-outerY;
  var behindN=0, list=[];
  for(i=0;i<pos.length;i++){
    var xi=X(pos[i]), offL=false;
    if(xi<padL-18){ xi=padL-18; offL=true; behindN++; }
    if(xi > W+26) continue;      /* ゴール後に画面右へ抜けた馬はそのまま消す */
    var comb = ((field[i].uma % 5) - 2) * 5.0;   /* 馬番ごとの固定ずらし（±10px） */
    list.push({i:i, x:xi, y:innerY-(lanes?lanes[i]:0.3)*laneH+comb, off:offL, me:(i===meIdx)});
  }
  /* 重なり対策は「馬番ごとの固定オフセット」だけにしてある。
     毎フレーム押し出す方式は、競り合うと押す向きが反転してカクついたため廃止。
     多少の重なりは許容し、自分の馬は常に最前面に描く。 */
  /* 内（下）の馬を手前に、自分を最前面に */
  list.sort(function(p,q){ return p.me?1:(q.me?-1:(p.y-q.y)); });
  for(i=0;i<list.length;i++){
    var o=list[i], f=field[o.i];
    drawHorse(g, o.x, o.y, WAKU_COL[f.waku], WAKU_TXT[f.waku], f.uma, o.me, o.off?0.4:1, spd?spd[o.i]:16);
  }
  if(behindN>0){
    g.fillStyle='rgba(225,240,230,.85)'; g.font='bold 11px sans-serif'; g.textAlign='left';
    g.fillText('◀ 後方 '+behindN+'頭', padL-6, bTop+14);
  }
}

/* ---------- 位置どり：内ラチからの距離（0=内ラチ沿い / 1=大外） ----------
   脚質で定位置が決まり、器用さが低いほど外を回らされる。
   前が詰まれば外へ持ち出し、直線では差し馬が外に出す。
*/
function baseLane(f){
  var sid = f.style;
  var b = sid==='nige' ? 0.09 : (sid==='senko' ? 0.24 : 0.48);
  b += (1 - f.stats.skill/100) * 0.24;
  b += (((f.uma*37) % 100) / 100 - 0.5) * 0.14;
  return b<0.04 ? 0.04 : (b>0.9 ? 0.9 : b);
}
function updateLanes(rp, field, pos, c){
  var N = pos.length, i, j, D = c.distance;
  if(!rp.lane || rp.lane.length !== N){
    rp.lane = new Float32Array(N);
    rp.blk  = new Float32Array(N);
    for(i=0;i<N;i++) rp.lane[i] = baseLane(field[i]);
  }
  var lead = 0;
  for(i=0;i<N;i++) if(pos[i]>lead) lead = pos[i];
  for(i=0;i<N;i++){
    /* ゴールした馬は進路を固定する（通過後に寄れると不自然に見える） */
    if(pos[i] >= D) continue;
    var f = field[i], t = baseLane(f), rem = D - pos[i];
    /* 前が詰まっていたら外へ持ち出す */
    var blocked = 0;
    for(j=0;j<N;j++){
      if(j===i) continue;
      var d = pos[j]-pos[i];
      if(d>1.5 && d<10 && Math.abs(rp.lane[j]-rp.lane[i])<0.14) blocked++;
    }
    /* 競り合うと詰まり判定が0と1を行き来するので、なめらかに追従させる */
    rp.blk[i] += (blocked - rp.blk[i]) * 0.05;
    t += Math.min(0.32, rp.blk[i]*0.14);
    /* 直線では差し・先行が外へ回す */
    if(rem < c.straight+60){
      var lm = STYLES[f.style].lateMul;
      t += lm>1.1 ? 0.24 : (lm>0.9 ? 0.11 : 0.0);
    }
    /* 先頭は内ラチ沿いを通る。ただし直線に入ってからは寄せない。
       ゴール前で先頭に立った馬が、外から内へ一気に移動して見えてしまうため。 */
    if(rem > c.straight+60 && pos[i] >= lead-0.5) t = Math.min(t, 0.16);
    if(t<0.03) t=0.03; if(t>0.95) t=0.95;
    rp.lane[i] += (t - rp.lane[i]) * 0.030;
  }
  return rp.lane;
}

/* 1頭を描く：中継のトラッキング表示のような、軌跡つきのマーカー */
function drawHorse(g, x, y, col, txt, num, me, alpha, spd){
  var rr = me ? 15.5 : 12.5;
  g.globalAlpha = alpha;

  /* 軌跡（速いほど長い） */
  var tl = 18 + Math.max(0, Math.min(1,(spd-13)/7))*22;
  var tg = g.createLinearGradient(x-tl, y, x, y);
  tg.addColorStop(0, 'rgba(255,255,255,0)');
  tg.addColorStop(1, me ? 'rgba(255,212,94,.55)' : 'rgba(255,255,255,.26)');
  g.strokeStyle = tg; g.lineCap='round';
  g.lineWidth = rr*0.75;
  g.beginPath(); g.moveTo(x-tl, y); g.lineTo(x-2, y); g.stroke();

  /* 本体 */
  g.fillStyle='rgba(0,0,0,.35)';
  g.beginPath(); g.arc(x, y+1.5, rr, 0, 7); g.fill();
  g.fillStyle = col;
  g.beginPath(); g.arc(x, y, rr, 0, 7); g.fill();
  g.strokeStyle = me ? '#ffd45e' : 'rgba(8,16,12,.85)';
  g.lineWidth = me ? 2.6 : 1.6;
  g.stroke();

  /* 馬番 */
  g.fillStyle = txt; g.font='bold '+(me?16:13.5)+'px sans-serif';
  g.textAlign='center'; g.textBaseline='middle';
  g.fillText(num, x, y+0.5); g.textBaseline='alphabetic';

  /* 自分の馬の目印 */
  if(me){
    g.fillStyle='#ffd45e';
    g.beginPath();
    g.moveTo(x, y-rr-5); g.lineTo(x-7, y-rr-16); g.lineTo(x+7, y-rr-16);
    g.closePath(); g.fill();
  }
  g.globalAlpha = 1;
}

function wtext(g,s,x,y,lh){ for(var i=0;i<s.length;i++) g.fillText(s[i],x,y+i*lh); }


/* =====================================================================
   レースの音場（歓声・蹄音・ゲート）
   すべてWeb Audioで合成するので音声ファイルは要らず、オフラインでも鳴る。
   実況の声はこの中に埋もれて聞こえるため、声質を変えるより臨場感が出る。
   ===================================================================== */
var AC = null;
function audioCtx(){
  if(AC) return AC;
  try{ AC = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ AC = null; }
  return AC;
}
function noiseBuffer(ac, sec, brown){
  var len = Math.floor(ac.sampleRate*sec), b = ac.createBuffer(1, len, ac.sampleRate), d = b.getChannelData(0), last = 0, i;
  for(i=0;i<len;i++){
    var w = Math.random()*2-1;
    if(brown){ last = (last + 0.021*w)/1.02; d[i] = last*3.2; }
    else d[i] = w;
  }
  return b;
}

var Amb = {
  on:false, ac:null, master:null, crowd:null, crowdGain:null, hoofGain:null, hoofBuf:null,
  _t:0, _timer:0, _level:0, _close:0, _duckUntil:0,

  start:function(){
    var ac = audioCtx(); if(!ac || this.on) return;
    if(ac.state==='suspended'){ try{ ac.resume(); }catch(e){} }
    this.ac = ac; this.on = true;

    this.master = ac.createGain(); this.master.gain.value = 0.9;
    this.master.connect(ac.destination);

    /* 歓声：茶色ノイズを帯域で削って遠くのどよめきにする */
    var src = ac.createBufferSource();
    src.buffer = noiseBuffer(ac, 4, true); src.loop = true;
    var bp = ac.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=760; bp.Q.value=0.55;
    var hp = ac.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=200;
    this.crowdGain = ac.createGain(); this.crowdGain.gain.value = 0;
    src.connect(bp); bp.connect(hp); hp.connect(this.crowdGain); this.crowdGain.connect(this.master);
    src.start(); this.crowd = src;

    /* 歓声のうねり */
    var lfoSrc = ac.createBufferSource();
    lfoSrc.buffer = noiseBuffer(ac, 8, true); lfoSrc.loop = true;
    var lp = ac.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value = 0.7;
    var lfoG = ac.createGain(); lfoG.gain.value = 0.35;
    lfoSrc.connect(lp); lp.connect(lfoG); lfoG.connect(this.crowdGain.gain);
    lfoSrc.start();

    this.hoofBuf = noiseBuffer(ac, 0.12, false);   /* 毎回作ると重いので使い回す */
    this.hoofGain = ac.createGain(); this.hoofGain.gain.value = 0.0;
    this.hoofGain.connect(this.master);

    this._t = ac.currentTime + 0.1;
    var self = this;
    this._timer = setInterval(function(){ self._schedule(); }, 60);
  },

  /* 蹄音：18頭ぶんが重なった連続した地鳴り */
  _schedule:function(){
    var ac = this.ac; if(!ac) return;
    var ahead = ac.currentTime + 0.22;
    while(this._t < ahead){
      this._hoof(this._t);
      this._t += 0.052 + Math.random()*0.034;
    }
  },
  _hoof:function(t){
    var ac = this.ac;
    var g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.5+Math.random()*0.5, t+0.004);
    g.gain.exponentialRampToValueAtTime(0.0001, t+0.085);
    var n = ac.createBufferSource(); n.buffer = this.hoofBuf;
    var lp = ac.createBiquadFilter(); lp.type='lowpass';
    lp.frequency.value = 220 + Math.random()*180; lp.Q.value = 0.8;
    n.connect(lp); lp.connect(g); g.connect(this.hoofGain);
    n.start(t); n.stop(t+0.12);
    /* 低い胴鳴り */
    var o = ac.createOscillator(); o.type='sine';
    o.frequency.setValueAtTime(70+Math.random()*25, t);
    var og = ac.createGain();
    og.gain.setValueAtTime(0.0001, t);
    og.gain.exponentialRampToValueAtTime(0.28, t+0.006);
    og.gain.exponentialRampToValueAtTime(0.0001, t+0.09);
    o.connect(og); og.connect(this.hoofGain);
    o.start(t); o.stop(t+0.1);
  },

  /* progress 0-1、close 0-1（カメラが寄っているほど蹄音が近い） */
  update:function(progress, close, finale){
    if(!this.on || !this.ac) return;
    var now = this.ac.currentTime;
    var base = 0.05 + progress*0.16 + (finale?0.26:0);
    if(BGM.on && BGM.layer) base *= 0.22;            /* 実録の空気感が鳴っているぶん合成は控える */
    if(now < this._duckUntil) base *= 0.42;          /* 実況が入ったら歓声を下げる */
    this.crowdGain.gain.setTargetAtTime(base, now, 0.6);
    this.hoofGain.gain.setTargetAtTime(0.045 + close*0.085, now, 0.3);
  },
  duck:function(sec){
    if(!this.on || !this.ac) return;
    this._duckUntil = this.ac.currentTime + (sec||2.2);
  },
  /* ゲートが開く音 */
  gate:function(){
    if(!this.on || !this.ac) return;
    var ac=this.ac, t=ac.currentTime+0.02, i;
    for(i=0;i<3;i++){
      var o=ac.createOscillator(); o.type='square';
      o.frequency.setValueAtTime(420+i*260, t);
      var g=ac.createGain();
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(0.10,t+0.004);
      g.gain.exponentialRampToValueAtTime(0.0001,t+0.28);
      o.connect(g); g.connect(this.master); o.start(t); o.stop(t+0.3);
    }
    var n=ac.createBufferSource(); n.buffer=noiseBuffer(ac,0.3,false);
    var bp=ac.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=2600; bp.Q.value=1.2;
    var ng=ac.createGain();
    ng.gain.setValueAtTime(0.18,t); ng.gain.exponentialRampToValueAtTime(0.0001,t+0.22);
    n.connect(bp); bp.connect(ng); ng.connect(this.master); n.start(t); n.stop(t+0.3);
  },
  /* ゴール時の大歓声 */
  roar:function(){
    if(!this.on || !this.ac) return;
    var now=this.ac.currentTime;
    this._duckUntil = 0;
    this.crowdGain.gain.cancelScheduledValues(now);
    this.crowdGain.gain.setTargetAtTime(0.55, now, 0.25);
    this.crowdGain.gain.setTargetAtTime(0.30, now+2.2, 1.2);
  },
  stop:function(){
    if(!this.on) return;
    this.on=false;
    clearInterval(this._timer);
    try{
      var now=this.ac.currentTime;
      this.master.gain.setTargetAtTime(0.0001, now, 0.25);
      var m=this.master, c=this.crowd;
      setTimeout(function(){ try{ c.stop(); m.disconnect(); }catch(e){} }, 900);
    }catch(e){}
  }
};

   音声実況（ブラウザ内蔵の音声合成。外部サービスも音声ファイルも使わない）
   ===================================================================== */
var SPEECH_OK = (typeof window!=='undefined' && 'speechSynthesis' in window);
var _voice = null, _voiceReady = false;
function pickVoice(){
  if(!SPEECH_OK) return null;
  var vs = speechSynthesis.getVoices(), i, j;
  var pref = ['Hattori','O-Ren','Otoya','Kyoko'];     /* 実況らしい声から順に */
  for(i=0;i<pref.length;i++)
    for(j=0;j<vs.length;j++)
      if(vs[j].name.indexOf(pref[i])>=0) return vs[j];
  for(j=0;j<vs.length;j++) if(/^ja/i.test(vs[j].lang)) return vs[j];
  return null;
}
if(SPEECH_OK){
  _voice = pickVoice();
  speechSynthesis.onvoiceschanged = function(){ if(!_voice) _voice = pickVoice(); };
  /* iOSなどは一度ユーザー操作の中で呼ばないと音が出ないので、最初のタップで解錠する */
  var unlock = function(){
    if(_voiceReady) return;
    _voiceReady = true;
    try{
      var u = new SpeechSynthesisUtterance(' ');
      u.volume = 0; speechSynthesis.speak(u);
    }catch(e){}
    document.removeEventListener('pointerdown', unlock, true);
    document.removeEventListener('touchend', unlock, true);
  };
  document.addEventListener('pointerdown', unlock, true);
  document.addEventListener('touchend', unlock, true);
}

/* =====================================================================
   レース再生
   ===================================================================== */
var RACE_SECONDS = 42;
var FINAL_SPAN = 155;      /* 直線でカメラを固定する区間（m） */
var FINAL_SLOW = 0.45;     /* ゴール前の再生速度 */

/* =====================================================================
   BGM の再生
   画面ごとに一曲。同じ曲が続く画面では鳴らし続け、変わるときだけ
   クロスフェードする。実況がしゃべっている間は自動で音量を下げる。
   ===================================================================== */
var BGM_SCREEN = {
  title:'train', select:'train', hall:'train', howto:'train',
  train:'hl',                 /* ハイアンドローから振り分けまで同じ曲を流し続ける */
  entry:'fanfare', race:'race', rres:'result', result:'result'
};
/* レース中の混ざり具合：空気感40 ／ レース中BGM30 ／ 最終局面の歓声30 */
var AIR_VOL   = 0.40;         /* 場内のざわざわ（レース中ずっと敷く） */
var CHEER_VOL = 0.30;
var BGM_VOL = { train:0.50, hl:0.50, race:0.30, result:0.55, fanfare:0.38 };
var BGM_KEEP = { yay:1, aww:1 };   /* 短い効果音は入れ替えずに持ち続ける */
/* デコード済みを持っておく量。本数ではなくバイトで見る（曲の長さが倍半分違うため）。
   デコードすると AudioContext の周波数（44.1kHz）に伸びるので、32kHz の音源でも
   1.4倍ほどに膨らむ：空気感10.7／レース中8.5／リザルト7.5／歓声5.1／
   ハイアンドロー4.4／ファンファーレ4.0／育成中16.1（MB）。
   いちばん重なるのはレース中（空気感＋レース中＋歓声＋先読みしたリザルト＝約32MB）なので、
   そこが収まる36MBにしてある。終わればいちばん古いものから落ちる。
   本数で3本に制限していたときは、7本が3枠を奪い合って
   画面を変えるたびに必ず再ダウンロードになっていた。 */
var BGM_CACHE_BYTES = 36*1024*1024;
/* 次の画面で要る曲を、今の画面にいるあいだに取っておく。
   音源は別ファイルなので、取りに行ってから鳴らすと回線しだいで数秒遅れる。 */
var BGM_NEXT = {
  title:[], select:['hl'], hall:['hl'], howto:['hl'],
  train:['fanfare','race','air'],
  entry:['race','air','result'],
  race:['result'], rres:['hl'], result:['hl']
};
var CHEER_PEAK = 10.5;        /* ゴール歓声の音源で、歓声が最高潮になる位置（秒） */
var CHEER_LEAD = 1.8;         /* その何秒前から鳴らし始めるか（手前の歓声は使わない） */
var CHEER_FADE = 1.5;         /* 湧き上がらせる秒数。ゴール板でちょうど出しきる */
var CHEER_MUSIC_OUT = 3.2;    /* ゴールの何秒前から音楽を引かせるか */

/* 音源は audio/ に別ファイルで置いてある。必要になった時にだけ取りに行く。
   取れなかった場合は黙って無音にする（ローカルで直接開いた時など）。 */
var _fetching = {};
function fetchBuf(url, cb){
  var q = _fetching[url];
  if(q){ q.push(cb); return; }          /* 取得中なら相乗りする */
  q = _fetching[url] = [cb];
  var done = function(ab){
    delete _fetching[url];
    /* decodeAudioData は渡した ArrayBuffer を手放させるので、人数ぶん複製してから配る */
    var copies = [], i;
    for(i = 0; i < q.length; i++) copies.push(ab ? (i ? ab.slice(0) : ab) : null);
    for(i = 0; i < q.length; i++){ try{ q[i](copies[i]); }catch(e){} }
  };
  var xhr = new XMLHttpRequest();
  xhr.open('GET', url, true);
  xhr.responseType = 'arraybuffer';
  xhr.onload  = function(){ done(xhr.status === 200 || xhr.status === 0 ? (xhr.response || null) : null); };
  xhr.onerror = function(){ done(null); };
  try{ xhr.send(); }catch(e){ done(null); }
}

var BGM = {
  on:true, ac:null, master:null, node:null, key:null,
  buf:{}, lru:[], _le:{}, _unlocked:false, _want:null,
  layer:null, layerKey:null,
  _loading:null, _lLoad:null,         /* いま取りに行っている曲／層。二重に取らないため */
  _pre:[], _preBusy:false, _preT:null,  /* 先読みの待ち行列 */

  loadPref:function(){
    try{ var v = localStorage.getItem('sankan_bgm'); if(v!==null) return v==='1'; }catch(e){}
    return this._mem !== false;
  },
  savePref:function(){
    this._mem = this.on;
    try{ localStorage.setItem('sankan_bgm', this.on?'1':'0'); }catch(e){}
  },

  init:function(){
    if(this.master) return this.master;
    var ac = audioCtx(); if(!ac) return null;
    this.ac = ac;
    this.master = ac.createGain();
    this.master.gain.value = 1;
    /* 空気感・BGM・歓声が重なるので、振り切れないように頭を押さえておく */
    var lim = ac.createDynamicsCompressor();
    lim.threshold.value = -2; lim.knee.value = 0; lim.ratio.value = 20;
    lim.attack.value = 0.003; lim.release.value = 0.25;
    this.master.connect(lim); lim.connect(ac.destination);
    return this.master;
  },

  /* 止まっていたら起こす。バックグラウンドから戻ったときなど何度でも呼ぶ */
  resume:function(){
    var ac = this.ac || audioCtx();
    if(ac && ac.state === 'suspended'){ try{ ac.resume(); }catch(e){} }
  },

  /* 最初のタップで AudioContext を起こす。それまでに要求された曲をここで鳴らす */
  unlock:function(){
    this.resume();
    if(this._unlocked) return;
    this._unlocked = true;
    this.preload('yay'); this.preload('aww');
    if(this._want) this.play(this._want);
    this.queuePreload(BGM_NEXT.select);     /* 解錠前の forScreen では先読みできていない */
  },

  forScreen:function(n){
    if(n === 'race'){ this.playLayer('air', AIR_VOL); }
    else if(n === 'rres'){ this.fadeSfx(4.5); this.stopLayer(4.5); }  /* 歓声と空気感は結果画面まで引っぱる */
    else { this.fadeSfx(0.8); this.stopLayer(1.0); }
    this.play(BGM_SCREEN[n]);
    this.queuePreload(BGM_NEXT[n]);
  },

  /* 曲の下に敷く層。曲が切り替わっても消えない */
  playLayer:function(key, vol){
    if(!this.on || !this._unlocked) return;
    if(this.layerKey === key && (this.layer || this._lLoad === key)) return;
    this.layerKey = key;
    var self = this;
    var go = function(buffer){
      if(self.layerKey !== key) return;
      var m = self.init(); if(!m) return;
      var ac = self.ac, t = ac.currentTime;
      self._fadeNode(self.layer, 1.0); self.layer = null;
      var g = ac.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(vol, t + 1.6);
      var s = ac.createBufferSource();
      s.buffer = buffer; s.loop = true;
      s.loopStart = 0; s.loopEnd = self._loopEnd(key, buffer);
      s.connect(g); g.connect(m);
      try{ s.start(); }catch(e){ return; }
      self.layer = {src:s, gain:g};
    };
    var b = this.buf[key];
    if(b){ this._touch(key); go(b); return; }
    var src = BGM_SRC[key]; if(!src) return;
    var ac = this.ac || audioCtx(); if(!ac) return;
    this.ac = ac;
    this._lLoad = key;
    var fin = function(){ if(self._lLoad === key) self._lLoad = null; };
    fetchBuf(src, function(ab){ if(!ab) return fin();
    try{
      ac.decodeAudioData(ab, function(buffer){
        self.buf[key] = buffer; self._touch(key); fin(); go(buffer);
      }, fin);
    }catch(e){ fin(); }
    });
  },
  stopLayer:function(sec){
    this.layerKey = null; this._lLoad = null;
    this._fadeNode(this.layer, sec || 1.0);
    this.layer = null;
  },

  play:function(key){
    if(!key){ this.key = null; this._loading = null; this._fadeOut(0.6); return; }
    this._want = key;
    /* 同じ曲は鳴らし続ける。取りに行っている最中なら、もう一度取りに行かない */
    if(this.key === key && (this.node || this._loading === key)) return;
    this.key = key;
    if(!this.on) return;
    if(!this._unlocked){ return; }                 /* タップを待つ */
    var self = this, b = this.buf[key];
    if(b){ this._loading = null; this._touch(key); this._start(key, b); return; }
    var src = BGM_SRC[key]; if(!src) return;
    var ac = this.ac || audioCtx(); if(!ac) return;
    this.ac = ac;
    /* ここに来たということは、まだ音源が手元にない。
       読み終わるのを待ってから前の曲を落とすと、回線が細い端末では
       前の画面の曲が数秒そのまま鳴り続ける。だから待たずにここで落とす。 */
    this._loading = key;
    this._fadeOut(0.8);
    var fin = function(){ if(self._loading === key) self._loading = null; };
    fetchBuf(src, function(ab){ if(!ab) return fin();
    try{
      ac.decodeAudioData(ab, function(buffer){
        self.buf[key] = buffer; self._touch(key); fin();
        /* 読み込み中に画面が変わっていたら捨てる。
           すでに同じ曲が鳴っていたら二重に重ねない */
        if(self.key === key && !self.node) self._start(key, buffer);
      }, fin);
    }catch(e){ fin(); }
    });
    this._pump();
  },

  /* 次に要る曲を1本ずつ取っておく。いま鳴らす曲の読み込みが先で、横取りはしない */
  queuePreload:function(list){
    if(!list || !this.on || !this._unlocked) return;
    for(var i=0;i<list.length;i++){
      var k = list[i];
      if(BGM_SRC[k] && !this.buf[k] && this._pre.indexOf(k) < 0) this._pre.push(k);
    }
    this._pump();
  },
  _pump:function(){
    var self = this;
    if(this._preBusy) return;
    if(this._loading || this._lLoad){            /* いま鳴らす曲が先。少し待ってやり直す */
      if(this._preT || !this._pre.length) return;
      this._preT = setTimeout(function(){ self._preT = null; self._pump(); }, 700);
      return;
    }
    while(this._pre.length && (this.buf[this._pre[0]]
          || this._pre[0] === this._loading || this._pre[0] === this._lLoad)) this._pre.shift();
    var key = this._pre.shift();
    if(!key) return;
    var src = BGM_SRC[key];
    var ac = this.ac || audioCtx();
    if(!src || !ac) return;
    this.ac = ac;
    this._preBusy = true;
    var next = function(){ self._preBusy = false; self._pump(); };
    fetchBuf(src, function(ab){ if(!ab) return next();
    try{
      ac.decodeAudioData(ab, function(buffer){
        self.buf[key] = buffer; self._touch(key); next();
      }, next);
    }catch(e){ next(); }
    });
  },

  /* 使った順に並べ替え、容量をはみ出したぶんは捨てる
     （鳴っている曲・敷いている層・取りに行っている最中のものは残す） */
  _touch:function(key){
    if(BGM_KEEP[key]) return;                 /* 常駐ぶんは入れ替え対象に入れない */
    var i = this.lru.indexOf(key);
    if(i >= 0) this.lru.splice(i,1);
    this.lru.push(key);
    var guard = 0;
    while(this._bytes() > BGM_CACHE_BYTES && this.lru.length > 1 && guard++ < this.lru.length + 4){
      var drop = this.lru.shift();
      if(drop !== this.key && drop !== this.layerKey && drop !== this._loading && drop !== this._lLoad){
        delete this.buf[drop]; delete this._le[drop];
      } else this.lru.push(drop);
    }
  },
  _bytes:function(){
    var n = 0, i, b;
    for(i = 0; i < this.lru.length; i++){
      b = this.buf[this.lru[i]];
      if(b) n += b.length * b.numberOfChannels * 4;   /* デコード後は32bit浮動小数 */
    }
    return n;
  },

  /* 音源の末尾には数秒の無音が入っていることがある（ハイアンドローで6.4秒）。
     そのまま loop させると一周ごとに音が消えるので、鳴っている終わりで折り返す。 */
  _loopEnd:function(key, buffer){
    if(this._le[key] != null) return this._le[key];
    var d = buffer.getChannelData(0), sr = buffer.sampleRate;
    var win = Math.floor(sr*0.02), s, i, acc, last = d.length;
    for(s = d.length-win; s > 0; s -= win){
      acc = 0;
      for(i = s; i < s+win; i += 4) acc += d[i]*d[i];
      if(Math.sqrt(acc/(win/4)) > 0.0015){ last = s+win; break; }   /* 余韻は残す */
    }
    var e = last/sr + 0.15;
    if(e > buffer.duration || e < buffer.duration*0.3) e = buffer.duration;
    this._le[key] = e;
    return e;
  },

  _start:function(key, buffer){
    var m = this.init(); if(!m) return;
    var ac = this.ac, t = ac.currentTime, vol = BGM_VOL[key] || 0.5;
    this._fadeOut(0.5);
    var g = ac.createGain(); g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + (key==='fanfare' ? 0.12 : 0.9));
    var s = ac.createBufferSource();
    s.buffer = buffer;
    s.loop = (key !== 'fanfare');               /* ファンファーレだけ一度きり */
    if(s.loop){ s.loopStart = 0; s.loopEnd = this._loopEnd(key, buffer); }
    s.connect(g); g.connect(m);
    try{ s.start(); }catch(e){ return; }
    this.node = {src:s, gain:g, vol:vol};
  },

  _fadeNode:function(n, sec){
    if(!n) return;
    var ac = this.ac, t = ac.currentTime;
    try{
      n.gain.gain.cancelScheduledValues(t);
      n.gain.gain.setValueAtTime(n.gain.gain.value, t);
      n.gain.gain.linearRampToValueAtTime(0.0001, t + sec);
      n.src.stop(t + sec + 0.05);
    }catch(e){}
  },
  _fadeOut:function(sec){
    var n = this.node; this.node = null;
    this._fadeNode(n, sec);
  },

  stop:function(){ this.key = null; this._loading = null; this._fadeOut(0.5); },
  fadeTrack:function(sec){ this.key = null; this._loading = null; this._fadeOut(sec||2); },

  /* 先にデコードだけ済ませておく（歓声は頭出しの精度が要るので待てない） */
  preload:function(key){
    if(!key || this.buf[key]) { if(key) this._touch(key); return; }
    var src = BGM_SRC[key]; if(!src) return;
    var ac = this.ac || audioCtx(); if(!ac) return;
    this.ac = ac;
    var self = this;
    fetchBuf(src, function(ab){ if(!ab) return;
    try{
      ac.decodeAudioData(ab, function(buffer){
        self.buf[key] = buffer; self._touch(key);
      }, function(){});
    }catch(e){}
    });
  },

  /* 一度きりの差し込み。offset は関数でも渡せる（デコード待ちのぶんを補正するため）。
     fadeIn を渡すと、その秒数をかけて湧き上がらせる（途中から鳴らすときは短くする）。
     fadeCur を渡すと、鳴っていた曲をその秒数で落として場を明け渡す。 */
  cue:function(key, offset, vol, fadeCur, fadeIn){
    if(!this.on || !this._unlocked) return;
    var self = this;
    var go = function(buffer){
      var m = self.init(); if(!m) return;
      var ac = self.ac, t = ac.currentTime, v = vol || 0.7;
      var off = (typeof offset === 'function') ? offset() : (offset||0);
      if(off < 0) off = 0;
      if(off > buffer.duration-0.15) off = buffer.duration-0.15;
      if(fadeCur){ self._fadeOut(fadeCur); self.key = key; }
      self.fadeSfx(0.12);                       /* 前の効果音が残っていたら軽く消す */
      var fi = (typeof fadeIn === 'function') ? fadeIn(off) : (fadeIn||0);
      var g = ac.createGain();
      if(fi > 0.05){
        g.gain.setValueAtTime(0.0001, t);
        g.gain.setTargetAtTime(v, t, fi/3.2);    /* 直線より自然に立ち上がる */
      } else g.gain.setValueAtTime(v, t);
      var s = ac.createBufferSource(); s.buffer = buffer;
      s.connect(g); g.connect(m);
      try{ s.start(t, off); }catch(e){ return; }
      self.sfx = {src:s, gain:g};
    };
    var b = this.buf[key];
    if(b){ this._touch(key); go(b); return; }
    var src = BGM_SRC[key]; if(!src) return;
    var ac = this.ac || audioCtx(); if(!ac) return;
    this.ac = ac;
    fetchBuf(src, function(ab){ if(!ab) return;
    try{
      ac.decodeAudioData(ab, function(buffer){
        self.buf[key] = buffer; self._touch(key); go(buffer);
      }, function(){});
    }catch(e){}
    });
  },

  fadeSfx:function(sec){
    var n = this.sfx; this.sfx = null;
    this._fadeNode(n, sec);
  },

  /* 実況がしゃべっている間だけ下げる */
  duck:function(sec){
    if(!this.on || !this.master) return;
    var ac = this.ac, t = ac.currentTime;
    try{
      this.master.gain.cancelScheduledValues(t);
      this.master.gain.setValueAtTime(this.master.gain.value, t);
      this.master.gain.linearRampToValueAtTime(0.32, t + 0.2);
      this.master.gain.linearRampToValueAtTime(1, t + (sec || 2.2));
    }catch(e){}
  },

  setOn:function(v){
    this.on = v; this.savePref();
    if(v){
      this.unlock();
      var k = this.key, lk = this.layerKey;
      this.key = null; this.play(k || this._want);
      if(lk){ this.layerKey = null; this.playLayer(lk, AIR_VOL); }
      this._pump();
    } else {
      this._fadeOut(0.35); this.fadeSfx(0.35);
      this._fadeNode(this.layer, 0.35); this.layer = null;
    }
  }
};

/* 読み上げが誤る語は、読みに置き換えてから渡す。

var YOMI = [

  [/日本クラウン/g, 'にっぽんクラウン'],
  [/菊華賞/g,     'きっかしょう'],
  [/有真記念/g,   'ありまきねん']
];
function yomi(t){
  for(var i=0;i<YOMI.length;i++) t = t.replace(YOMI[i][0], YOMI[i][1]);
  return t;
}

G.say = function(text, hot){
  if(!this.voiceOn || !SPEECH_OK || !text) return;
  try{
    speechSynthesis.cancel();                 /* 実況なので常に最新を優先 */
    var u = new SpeechSynthesisUtterance(yomi(text));
    if(!_voice) _voice = pickVoice();
    if(_voice) u.voice = _voice;
    u.lang = 'ja-JP';
    /* 終盤ほど速く・高く読んで実況の高揚感を出す */
    var sp = 1.20, pi = 1.05;
    if(hot===1){ sp = 1.32; pi = 1.16; }
    if(hot===2){ sp = 1.42; pi = 1.26; }
    if(this.rp && this.rp.speed===2) sp *= 1.18;
    u.rate = sp>2 ? 2 : sp; u.pitch = pi; u.volume = 1;
    speechSynthesis.speak(u);
  }catch(e){}
};
G.telop = function(msg, say, hot){
  var el=$('rcTeleTxt'); if(el) el.innerHTML = msg;
  if(say && this.voiceOn){
    var d = Math.min(4, 1.0 + say.length*0.085);
    Amb.duck(d); BGM.duck(d);
  }
  this.say(say, hot);
};
G.stopVoice = function(){ if(SPEECH_OK){ try{ speechSynthesis.cancel(); }catch(e){} } };

G.startRace = function(){
  var c=this.course, f=this.field;
  var i;
  for(i=0;i<f.length;i++) if(f[i].isMe) this.meIdx=i;
  var tries = isPerfectHorse(this.horse) ? 40 : 1;   /* 完成馬は勝ち確定 */
  for(i=0;i<tries;i++){
    this.sim = simulateRace(c, f, (Math.random()*2147483647)|0);
    var mr = null, j;
    for(j=0;j<this.sim.result.length;j++) if(this.sim.result[j].idx===this.meIdx) mr=this.sim.result[j];
    if(mr.rank===1) break;
  }
  /* ゴール後は着順が位置では決まらないので、確定タイムを引けるようにしておく */
  this.finTime = new Float32Array(f.length);
  for(i=0;i<this.sim.result.length;i++) this.finTime[this.sim.result[i].idx] = this.sim.result[i].time;

  /* 歓声の頭出し用に「いまから1着のゴールまで実時間で何秒か」を引けるようにする。
     再生は残り270mから減速するので、その分を織り込んだ累積表を作っておく。
     等速ぶんを貯めておけば、実際の残り時間は rp.speed で割るだけで出る。 */
  var fc=this.sim.frameCount, dtS=this.sim.dt, kk=(fc*dtS)/RACE_SECONDS, acc=0, fr, mx, j, rem, sl;
  this.cumReal = new Float32Array(fc);
  for(i=0;i<fc;i++){
    fr=this.sim.frames[i]; mx=0;
    for(j=0;j<fr.length;j++) if(fr[j]>mx) mx=fr[j];
    rem = c.distance-mx;
    sl = 1;
    if(rem<270){ sl = FINAL_SLOW + (1-FINAL_SLOW)*Math.max(0,(rem-55))/215; if(sl>1) sl=1; }
    this.cumReal[i] = acc;
    acc += dtS/(kk*sl);
  }
  this.winTime = this.sim.result[0].time;
  BGM.queuePreload(['cheer']);

  $('rcName').textContent=c.name;
  $('rcCond').textContent=c.track+'　'+c.surface+c.distance+'m　'+c.grade;
  this.renderTicket();
  if(this.voiceOn===undefined) this.voiceOn = this.loadVoicePref();
  this.syncVoiceBtn();
  this.telop('<b>各馬がゲートに入りました。</b>', '各馬がゲートに入りました');
  this.rp = {
    t:0, speed:1, playing:true, done:false, last:0,
    va:null, vb:null, snap:true, lane:null, blk:null, remLead:null, roared:false,
    cheered:false, musicOut:false, skipped:false,
    telo:this.buildTelop(), teloIdx:0
  };
  this.setSpeed(1);
  if(this.voiceOn) { Amb.start(); Amb.gate(); }
  this.show('race');
  this.fitCanvas();
  var self=this;
  cancelAnimationFrame(this._raf);
  this.rp.last=performance.now();
  var step=function(now){
    var rp=self.rp;
    var dtr=(now-rp.last)/1000; rp.last=now;
    if(!(dtr>0)) dtr=0; else if(dtr>0.05) dtr=0.05;
    if(rp.playing){
      var total=self.sim.frameCount*self.sim.dt;
      var slow = 1;
      if(rp.remLead != null && rp.remLead < 270){
        slow = FINAL_SLOW + (1-FINAL_SLOW)*Math.max(0,(rp.remLead-55))/215;
        if(slow>1) slow=1;
      }
      rp.t += dtr*(total/RACE_SECONDS)*rp.speed*slow;
      if(rp.t>=total){ rp.t=total; rp.playing=false; self.endRace(); }
    }
    self.renderRace();
    if(!rp.done) self._raf=requestAnimationFrame(step);
  };
  this._raf=requestAnimationFrame(step);
};

G.fitCanvas=function(){
  var a=$('cvTrack'), b=$('cvMap');
  var w=a.clientWidth||400;
  a.height=Math.round(w*0.54*2); a.width=Math.round(w*2);
  b.height=Math.round(w*0.44*2); b.width=Math.round(w*2);
  a.style.height=Math.round(w*0.54)+'px';
  b.style.height=Math.round(w*0.44)+'px';
};

G.setSpeed=function(s){
  this.rp.speed=s;
  $('sp1').className=s===1?'on':'';
  $('sp2').className=s===2?'on':'';
  $('sp3').className='';
};
G.skipToFinal=function(){
  var rp=this.rp;
  /* レースは一度きり。すでに直線に入っていたら巻き戻さない */
  if(!rp || rp.done || rp.skipped) return;
  var sim=this.sim, c=this.course, target=c.distance-Math.min(620,c.straight+120);
  var fi=0;
  for(var i=0;i<sim.frames.length;i++){
    var lead=0,j;
    for(j=0;j<sim.frames[i].length;j++) if(sim.frames[i][j]>lead) lead=sim.frames[i][j];
    if(lead>=target){ fi=i; break; }
  }
  if(fi*sim.dt <= rp.t) return;        /* もう通り過ぎている */
  rp.skipped=true;
  this.rp.t=fi*sim.dt;
  /* 飛ばした分の実況は消化済みにする */
  while(this.rp.teloIdx<this.rp.telo.length && this.rp.telo[this.rp.teloIdx].at<=target)
    this.rp.teloIdx++;
  this.telop('<b>さあ、最後の直線です。</b>', 'さあ、最後の直線です');
  this.rp.playing=true; this.rp.speed=1; this.rp.snap=true; this.rp.lane=null;
  $('sp1').className=''; $('sp2').className=''; $('sp3').className='on';
};

G.frameAt=function(t){
  var sim=this.sim;
  if(!(t>0)) t=0;
  var fi=t/sim.dt;
  var a=Math.floor(fi), b, r;
  if(a>=sim.frameCount-1){ a=b=sim.frameCount-1; r=0; }
  else { b=a+1; r=fi-a; }
  var A=sim.frames[a], B=sim.frames[b], out=new Float32Array(A.length);
  for(var i=0;i<A.length;i++) out[i]=A[i]+(B[i]-A[i])*r;
  return out;
};

/* いまの再生位置から、1着がゴールするまでの実時間（秒） */
G.realToWin=function(){
  var sim=this.sim, rp=this.rp;
  if(!this.cumReal || this.winTime==null) return 1e9;
  var wi=Math.min(sim.frameCount-1, Math.round(this.winTime/sim.dt));
  var ci=Math.min(sim.frameCount-1, Math.max(0, Math.round(rp.t/sim.dt)));
  if(ci>=wi) return 0;
  return (this.cumReal[wi]-this.cumReal[ci])/(rp.speed||1);
};

G.renderRace=function(){
  var c=this.course, f=this.field, sim=this.sim, rp=this.rp;
  var pos=this.frameAt(rp.t), i;
  var lead=0, last=1e9;
  for(i=0;i<pos.length;i++){ if(pos[i]>lead) lead=pos[i]; if(pos[i]<last) last=pos[i]; }
  var rem=Math.max(0, Math.round((c.distance-lead)/10)*10);
  var remText='残り '+rem+'m　（先頭）';


  /* カメラ。直線に入ったらゴールを右に置いて固定し、馬群が左から入ってくる */
  var va, vb;
  if(lead >= c.distance-FINAL_SPAN*0.72){
    vb = c.distance + FINAL_SPAN*0.27;      /* ゴール板の先に走り抜ける余白 */
    va = vb - FINAL_SPAN;
  } else {
    var spread = lead-last;
    var span = spread*1.32+20;
    if(span<72) span=72; if(span>420) span=420;
    vb = lead+span*0.28;   /* 先頭を画面の7割あたりに置き、馬群を中央寄りにする */
    if(vb > c.distance+span*0.09) vb = c.distance+span*0.09;
    va = vb-span;
    if(va < -span*0.05){ va=-span*0.05; vb=va+span; }
  }
  if(rp.va==null || rp.snap){ rp.va=va; rp.vb=vb; rp.snap=false; }
  else { rp.va += (va-rp.va)*0.10; rp.vb += (vb-rp.vb)*0.10; }
  rp.remLead = c.distance-lead;
  /* 「直線から」は直線に入るまでの一度きり。巻き戻して何度も見られないようにする */
  var sp3=$('sp3');
  if(sp3) sp3.disabled = rp.done || rp.skipped || rp.remLead <= Math.min(620, c.straight+120);
  var closeness = 1 - Math.min(1, (rp.vb-rp.va-70)/350);
  Amb.update(lead/c.distance, closeness<0?0:closeness, rp.remLead < c.straight);
  /* ゴール前。まず音楽を引かせ、最後にゴール歓声を一度だけ重ねる。
     音源には手前にも何度か歓声が入っているので頭からは鳴らさず、
     最高潮の位置（CHEER_PEAK）がちょうどゴール板に重なるよう頭出しする。
     デコード待ちで出遅れた分は、鳴らす瞬間に残り時間を測り直して吸収する。 */
  if(!rp.cheered || !rp.musicOut){
    var toWin = this.realToWin();
    if(!rp.musicOut && toWin <= CHEER_MUSIC_OUT){ rp.musicOut = true; BGM.fadeTrack(2.6); }
    if(!rp.cheered && toWin <= CHEER_LEAD){
      rp.cheered = true;
      var self2 = this;
      BGM.cue('cheer', function(){ return CHEER_PEAK - self2.realToWin(); },
        CHEER_VOL, 0, CHEER_FADE);
    }
  }
  if(rp.remLead<=0 && !rp.roared){ rp.roared=true; if(!(rp.cheered && BGM.on)) Amb.roar(); }

  var lanes = updateLanes(rp, f, pos, c);
    /* 各馬の速度（軌跡の長さに使う） */
  var prev = this.frameAt(Math.max(0, rp.t-0.25));
  var spd = new Float32Array(pos.length);
  for(i=0;i<pos.length;i++) spd[i]=(pos[i]-prev[i])/0.25;
  drawTrack($('cvTrack'), c, pos, this.meIdx, f, {a:rp.va,b:rp.vb}, remText, lanes, spd);
  drawMiniMap($('cvMap'), c, {lead:lead,last:last}, pos[this.meIdx], 0);

  /* 上位5頭＋自分 */
  var ord=[], ft=this.finTime, DD=c.distance;
  for(i=0;i<pos.length;i++) ord.push({i:i,p:pos[i],done:pos[i]>=DD-0.01});
  ord.sort(function(a,b){
    if(a.done&&b.done) return ft[a.i]-ft[b.i];
    if(a.done) return -1;
    if(b.done) return 1;
    return b.p-a.p;
  });
  var myRank=0;
  for(i=0;i<ord.length;i++) if(ord[i].i===this.meIdx) myRank=i+1;
  var vAvg = DD/Math.max(1,sim.winTime);
  function gapOf(o){
    if(o.done && ord[0].done) return (ft[o.i]-ft[ord[0].i])*vAvg;
    return ord[0].p-o.p;
  }
  var h='', n=Math.min(5,ord.length);
  for(i=0;i<n;i++){
    var o=ord[i], fx=f[o.i], gap=gapOf(o);
    h+='<div class="ln'+(o.i===this.meIdx?' me':'')+'">'
      +'<span class="rk">'+(i+1)+'</span>'
      +'<span class="waku w'+fx.waku+'" style="width:17px;height:17px;font-size:10px">'+fx.uma+'</span>'
      +'<span class="nm">'+esc(fx.name)+'</span>'
      +'<span class="gap">'+(i===0?'先頭':bashin(gap))+'</span></div>';
  }
  if(myRank>5){
    var og=gapOf(ord[myRank-1]);
    h+='<div class="ln me"><span class="rk">'+myRank+'</span>'
      +'<span class="waku w'+f[this.meIdx].waku+'" style="width:17px;height:17px;font-size:10px">'+f[this.meIdx].uma+'</span>'
      +'<span class="nm">'+esc(f[this.meIdx].name)+'</span>'
      +'<span class="gap">'+bashin(og)+'</span></div>';
  }
  $('rcLive').innerHTML=h;

  /* 実況 */
  while(rp.teloIdx<rp.telo.length && lead>=rp.telo[rp.teloIdx].at){
    var tl=rp.telo[rp.teloIdx];
    if(rp.teloIdx===rp.telo.length-1 || lead<rp.telo[rp.teloIdx+1].at) this.telop(tl.msg, tl.say, tl.hot);
    rp.teloIdx++;
  }
};

/* 着差を馬身で表す（1馬身 ≒ 2.4m） */
function bashin(m){
  if(m<0.25) return 'ハナ';
  if(m<0.6)  return 'クビ';
  if(m<1.1)  return 'アタマ';
  var b=m/2.4;
  return (b<10 ? b.toFixed(1) : Math.round(b))+'馬身';
}

/* ---------- 自分の馬の単勝馬券 ----------
   実際の勝馬投票券の券面構成を参考に組んでいる。
   左：開催回次／競馬場／レース番号／二次元コード／回次・格・レース名／発売所
   中：式別（普通・単勝）を縦書きで囲んだ枠
   右：馬番と金額／馬名／合計
   下：通し番号。背景には淡緑の透かしと水色の縦帯を敷く。
   透かしと発売所の TRC は実在しない架空の略称（TURF CROWN より）。       */

/* 券面の二次元コードに見えるパターンを seed から生成（実際には読めない飾り） */
var _qrCache={};
function fakeQR(seed){
  if(_qrCache[seed]) return _qrCache[seed];
  var n=21, px=5, cv=document.createElement('canvas');
  cv.width=cv.height=n*px;
  var x=cv.getContext('2d'), i, j, st=(seed>>>0)||1;
  function rnd(){ st^=st<<13; st>>>=0; st^=st>>>17; st^=st<<5; st>>>=0; return st/4294967296; }
  x.fillStyle='#fcfcf6'; x.fillRect(0,0,cv.width,cv.height);
  x.fillStyle='#0c0c0c';
  for(i=0;i<n;i++) for(j=0;j<n;j++) if(rnd()<0.46) x.fillRect(j*px,i*px,px,px);
  function finder(ox,oy){
    var cx=ox?ox-1:ox, cy=oy?oy-1:oy;
    x.fillStyle='#fcfcf6'; x.fillRect(cx*px,cy*px,8*px,8*px);
    x.fillStyle='#0c0c0c'; x.fillRect(ox*px,oy*px,7*px,7*px);
    x.fillStyle='#fcfcf6'; x.fillRect((ox+1)*px,(oy+1)*px,5*px,5*px);
    x.fillStyle='#0c0c0c'; x.fillRect((ox+2)*px,(oy+2)*px,3*px,3*px);
  }
  finder(0,0); finder(n-7,0); finder(0,n-7);
  x.fillStyle='#0c0c0c';
  for(i=8;i<n-8;i++) if(i%2===0){ x.fillRect(i*px,6*px,px,px); x.fillRect(6*px,i*px,px,px); }
  _qrCache[seed]=cv.toDataURL();
  return _qrCache[seed];
}

/* ---------- 実況テロップ ----------
   実際の中継の構成に合わせ、発走→先行争い→隊列→ペース→道中→勝負どころ
   →4コーナー→直線→残り300/200/100→ゴール→総括 と細かく刻む。
   内容はシミュレーション結果から判定するので、毎回ちがう実況になる。
*/
G.buildTelop=function(){
  var sim=this.sim, c=this.course, f=this.field, me=this.meIdx;
  var D=c.distance, N=f.length, i, k;
  var meRes=null;
  for(i=0;i<sim.result.length;i++) if(sim.result[i].idx===me) meRes=sim.result[i];
  var MYU=f[me].uma, MYN=f[me].name, MYSTYLE=f[me].style;

  function pick(a){ return a[(Math.random()*a.length)|0]; }
  function idxAt(d){
    for(var q=0;q<sim.frames.length;q++){
      var L=0, fr=sim.frames[q];
      for(var z=0;z<fr.length;z++) if(fr[z]>L) L=fr[z];
      if(L>=d) return q;
    }
    return sim.frames.length-1;
  }
  function at(d){ return sim.frames[idxAt(d)]; }
  function order(p){
    var o=[]; for(var z=0;z<N;z++) o.push(z);
    o.sort(function(x,y){return p[y]-p[x];});
    return o;
  }
  function numOf(p,rank){ return f[order(p)[rank-1]].uma; }
  function nameOf(p,rank){ return f[order(p)[rank-1]].name; }
  function rankOf(p,idx){ var r=1; for(var z=0;z<N;z++) if(p[z]>p[idx]) r++; return r; }
  function rankIdx(p,idx){ return rankOf(p,idx); }
  function spreadOf(p){ var hi=-1e9,lo=1e9; for(var z=0;z<N;z++){ if(p[z]>hi)hi=p[z]; if(p[z]<lo)lo=p[z]; } return hi-lo; }
  function gap12(p){ var o=order(p); return p[o[0]]-p[o[1]]; }
  function mover(pA,pB){
    var best=1, bi=-1;
    for(var z=0;z<N;z++){
      var up=rankIdx(pA,z)-rankIdx(pB,z);
      if(up>best){ best=up; bi=z; }
    }
    return (best>=3 && bi>=0) ? f[bi].uma : 0;
  }
  function findU(u){ for(var z=0;z<N;z++) if(f[z].uma===u) return z; return 0; }
  function badge(u){
    var h=f[findU(u)];
    return '<span class="waku w'+h.waku+'" style="display:inline-flex;width:18px;height:18px;'
      +'font-size:11px;vertical-align:middle;position:relative;top:-1px;margin:0 3px 0 2px">'+u+'</span>';
  }
  function MEB(){ return '<b class="me">'+badge(MYU)+'番</b>'; }
  function ord(r){ return r+'番手'; }

  var ev=[];
  function add(d,msg,say,hot){ ev.push({at:d, msg:msg, say:say, hot:hot||0}); }

  /* ===== 発走 ===== */
  var sMsg, sSay, sHot=1;
  if(meRes.bigGate){
    sMsg='<b>'+pick(['スタートしました！','一斉にスタート！'])+'</b> '+MEB()+'、<span style="color:#e2574c">出遅れた！</span>';
    sSay=pick(['スタートしました！','一斉にスタート！'])+' '+MYU+'番、出遅れた！';
  } else if(meRes.gateLoss<0.25){
    sMsg='<b>スタートしました！</b> '+MEB()+'、'+pick(['好スタート。','good。五分の発走。']);
    sSay='スタートしました！ '+MYU+'番、好スタート！';
  } else {
    sMsg='<b>'+pick(['スタートしました！','一斉にスタートが切られた！'])+'</b> '+pick(['揃った発走です。','大きな出遅れはありません。']);
    sSay=pick(['スタートしました！ 揃った発走です。','一斉にスタートが切られた！']);
  }
  add(1, sMsg, sSay, sHot);

  /* ===== 先行争い ===== */
  var pA=at(Math.min(280, D*0.14)), lA=numOf(pA,1);
  var aMsg, aSay;
  if(lA===MYU){
    aMsg='<b>'+MEB()+'がハナを切った！</b> 先手を主張します。';
    aSay=MYU+'番がハナを切った！ 先手を主張！';
  } else {
    aMsg=pick(['ハナを切ったのは','先手を取ったのは','先頭に立ったのは'])+badge(lA)+'<b>'+esc(nameOf(pA,1))+'</b>。'
      +MEB()+'は'+ord(rankOf(pA,me))+'。';
    aSay=pick(['ハナを切ったのは'+lA+'番！','先手を取ったのは'+lA+'番！'])+' '+MYU+'番は'+ord(rankOf(pA,me))+'。';
  }
  add(Math.min(280, D*0.14), aMsg, aSay, 1);

  /* ===== 隊列が決まる ===== */
  var pB=at(D*0.30), sp=spreadOf(pB);
  var form = sp>70 ? pick(['縦長の展開。','隊列は縦長です。']) : (sp<35 ? pick(['馬群は一団。','各馬ひとかたまりです。']) : '隊列が決まりました。');
  add(D*0.30,
    '<b>'+form+'</b> 先頭'+badge(numOf(pB,1))+'、2番手'+badge(numOf(pB,2))+'。'+MEB()+'は'+ord(rankOf(pB,me))+'。',
    form+' 先頭'+numOf(pB,1)+'番、2番手'+numOf(pB,2)+'番。'+MYU+'番は'+ord(rankOf(pB,me))+'。', 0);

  /* ===== ペース判定 ===== */
  var halfIdx=idxAt(D*0.5), halfSpd=(D*0.5)/Math.max(1,halfIdx*sim.dt);
  var stdSpd=D/(STD_TIME[c.key]||120);
  var paceMsg, paceSay;
  if(halfSpd > stdSpd*1.025){ paceMsg=pick(['<b>ペースは速い！</b>','<b>ハイペースで流れています。</b>']); paceSay=pick(['ペースは速い！','ハイペースで流れています。']); }
  else if(halfSpd < stdSpd*0.975){ paceMsg=pick(['<b>ペースは落ち着いています。</b>','<b>スローペース。</b>']); paceSay=pick(['ペースは落ち着いています。','スローペースです。']); }
  else { paceMsg='平均的なペースです。'; paceSay='平均的なペース。'; }
  var hold = MYSTYLE==='sashi' ? MEB()+'、じっくり脚をためています。' : MEB()+'、折り合いはついています。';
  var holdS = MYSTYLE==='sashi' ? MYU+'番、じっくり脚をためています。' : MYU+'番、折り合いはついています。';
  add(D*0.45, paceMsg+' '+hold, paceSay+' '+holdS, 0);

  /* ===== 道中（長距離のみ） ===== */
  if(D>=2400){
    var pC=at(D*0.58);
    add(D*0.58,
      pick(['向正面に入りました。','隊列に大きな動きはありません。'])+' 先頭'+badge(numOf(pC,1))+'、'+MEB()+'は'+ord(rankOf(pC,me))+'。',
      pick(['向正面に入りました。','大きな動きはありません。'])+' 先頭'+numOf(pC,1)+'番、'+MYU+'番は'+ord(rankOf(pC,me))+'。', 0);
  }
  if(D>=2800){
    add(D-1400, '<b>残り1400m</b>。'+MEB()+'は'+ord(rankOf(at(D-1400),me))+'。',
      '残り1400。'+MYU+'番は'+ord(rankOf(at(D-1400),me))+'。', 0);
  }

  /* ===== 残り1000 ===== */
  var p10=at(D-1000);
  add(D-1000, '<b>残り1000m</b>を切りました。先頭'+badge(numOf(p10,1))+'、'+MEB()+'は'+ord(rankOf(p10,me))+'。',
    '残り1000を切りました。先頭'+numOf(p10,1)+'番、'+MYU+'番は'+ord(rankOf(p10,me))+'。', 0);

  /* ===== 残り800 各馬が動く ===== */
  var p8=at(D-800), mv8=mover(p10,p8);
  var m8, s8;
  if(mv8 && mv8!==MYU){ m8='<b>後方から'+badge(mv8)+'が進出！</b> 各馬、動き出す。'; s8='後方から'+mv8+'番が進出してきた！'; }
  else if(mv8===MYU){ m8='<b>'+MEB()+'、位置を上げてきた！</b>'; s8=MYU+'番、ポジションを上げてきた！'; }
  else { m8=pick(['各馬、そろそろ動き出す。','手応えが怪しくなる馬も出てきました。']); s8=pick(['各馬、そろそろ動き出す。','ここから動きが出てきます。']); }
  add(D-800, m8, s8, 1);

  /* ===== 勝負どころ 残り600 ===== */
  var p6=at(D-600), mv6=mover(p8,p6), r6=rankOf(p6,me);
  var m6='<b>'+pick(['さあ勝負どころ！','3コーナーから4コーナー、各馬が仕掛けた！'])+'</b> ';
  var s6=pick(['さあ勝負どころ！','各馬が仕掛けた！'])+' ';
  if(r6<=3){ m6+=MEB()+'、絶好の手応え！'; s6+=MYU+'番、絶好の手応え！'; }
  else if(mv6===MYU){ m6+=MEB()+'、まくって上がってくる！'; s6+=MYU+'番、まくって上がってくる！'; }
  else { m6+=MEB()+'は'+ord(r6)+'。'; s6+=MYU+'番は'+ord(r6)+'。'; }
  add(D-600, m6, s6, 1);

  /* ===== 4コーナー（直線が短いコースのみ別途） ===== */
  if(c.straight < 460){
    var p4c=at(D-c.straight-110);
    add(D-c.straight-110,
      '<b>4コーナーカーブ！</b> 先頭は'+badge(numOf(p4c,1))+'、'+badge(numOf(p4c,2))+'が続く。',
      '4コーナーカーブ！ 先頭'+numOf(p4c,1)+'番！', 1);
  }

  /* ===== 直線入口 ===== */
  var pS=at(D-c.straight), rS=rankOf(pS,me);
  var mS='<b>'+pick(['さあ直線だ！','直線に入った！'])+'</b> 先頭は'+badge(numOf(pS,1))+'。';
  var sS=pick(['さあ直線だ！','直線に入った！'])+' 先頭'+numOf(pS,1)+'番！';
  if(rS===1){ mS='<b>'+MEB()+'先頭で直線に入った！</b>'; sS=MYU+'番、先頭で直線に入った！'; }
  else if(rS<=5){ mS+=' '+MEB()+'、追い出しにかかる！'; sS+=' '+MYU+'番、追い出しにかかる！'; }
  else { mS+=' '+MEB()+'は'+ord(rS)+'、ここから。'; sS+=' '+MYU+'番は'+ord(rS)+'！'; }
  add(D-c.straight, mS, sS, 1);

  /* ===== 残り300 ===== */
  if(c.straight>=320){
    var p3=at(D-300), g3=gap12(p3), r3=rankOf(p3,me);
    var m3, s3;
    if(g3<2.5){ m3='<b>残り300！</b> '+badge(numOf(p3,1))+'と'+badge(numOf(p3,2))+'の叩き合い！'; s3='残り300！ '+numOf(p3,1)+'番と'+numOf(p3,2)+'番の叩き合い！'; }
    else if(r3===1){ m3='<b>残り300！</b> '+MEB()+'が抜け出しにかかる！'; s3='残り300！ '+MYU+'番が抜け出しにかかる！'; }
    else { m3='<b>残り300！</b> 先頭'+badge(numOf(p3,1))+'、'+MEB()+'は'+ord(r3)+'！'; s3='残り300！ 先頭'+numOf(p3,1)+'番、'+MYU+'番は'+ord(r3)+'！'; }
    add(D-300, m3, s3, 2);
  }

  /* ===== 残り200 ===== */
  var p2=at(D-200), r2=rankOf(p2,me), g2=gap12(p2);
  var m2='<b>残り200！</b> ', s2='残り200！ ';
  if(r2===1 && g2>3){ m2+=MEB()+'、<b>後続を突き放す！</b>'; s2+=MYU+'番、後続を突き放す！'; }
  else if(r2===1){ m2+=MEB()+'が<b>先頭に立った</b>！'; s2+=MYU+'番、'+MYU+'番が出た！'; }
  else if(r2<=3){ m2+=MEB()+'、'+pick(['外から猛然と追い上げる！','内から鋭く伸びてくる！','外を回して追い上げる！']); s2+=MYU+'番、'+MYU+'番が来た！'; }
  else { m2+='先頭'+badge(numOf(p2,1))+'、'+MEB()+'は'+ord(r2)+'、苦しい！'; s2+='先頭'+numOf(p2,1)+'番！ '+MYU+'番は'+ord(r2)+'、苦しい！'; }
  add(D-200, m2, s2, 2);

  /* ===== 残り100 ===== */
  var p1h=at(D-100), r1h=rankOf(p1h,me), g1h=gap12(p1h);
  var m1, s1;
  if(g1h<1.5){ m1='<b>残り100！</b> '+badge(numOf(p1h,1))+'と'+badge(numOf(p1h,2))+'、<b>並んだ！</b>'; s1='残り100！ '+numOf(p1h,1)+'番と'+numOf(p1h,2)+'番、並んだ！'; }
  else if(r1h===1){ m1='<b>残り100！</b> '+MEB()+'、<b>このまま！</b>'; s1='残り100！ '+MYU+'番、このまま！'; }
  else { m1='<b>残り100！</b> '+MEB()+'、<b>届くか！</b>'; s1='残り100！ '+MYU+'番、届くか！'; }
  add(D-100, m1, s1, 2);

  /* ===== ゴール ===== */
  var win=sim.result[0], second=sim.result[1];
  var margin=second.time-win.time, mBody=margin*(D/win.time)/2.4;
  var winU=f[win.idx].uma, winN=f[win.idx].name;
  var mG, sG;
  if(meRes.rank===1){
    if(mBody<0.3){ mG='<b>ゴールイン！　ハナ差、'+badge(MYU)+esc(MYN)+'！</b>'; sG='ゴールイン！ ハナ差！ 一着、'+MYU+'番！'; }
    else if(mBody>6){ mG='<b>ゴールイン！　'+badge(MYU)+esc(MYN)+'、圧勝！</b>'; sG='ゴールイン！ '+MYU+'番、圧勝！'; }
    else { mG='<b>ゴールイン！　'+badge(MYU)+esc(MYN)+'、一着！</b>'; sG='ゴールイン！ 一着、'+MYU+'番！'; }
  } else if(meRes.rank<=3){
    mG='ゴールイン。勝ったのは'+badge(winU)+esc(winN)+'。'+MEB()+'は<b>'+meRes.rank+'着</b>、わずかに届かなかった。';
    sG='ゴールイン！ 勝ったのは'+winU+'番！ '+MYU+'番は'+meRes.rank+'着！';
  } else {
    mG='ゴールイン。勝ったのは'+badge(winU)+esc(winN)+'。'+MEB()+'は<b>'+meRes.rank+'着</b>。';
    sG='ゴールイン！ 勝ったのは'+winU+'番！ '+MYU+'番は'+meRes.rank+'着。';
  }
  add(D-2, mG, sG, 2);

  /* ===== 総括 ===== */
  var fMsg, fSay;
  if(meRes.rank===1){
    fMsg='<b>'+esc(MYN)+'、'+c.name+'を制しました！</b>';
    fSay=MYN+'、'+c.name+'を制しました！';
  } else {
    fMsg=esc(winN)+'が'+c.name+'を制しました。';
    fSay=winN+'が'+c.name+'を制しました。';
  }
  add(D-0.5, fMsg, fSay, 1);

  ev.sort(function(x,y){ return x.at-y.at; });
  /* 近すぎるものは間引く（喋りきれないため） */
  var out=[], lastAt=-1e9;
  for(i=0;i<ev.length;i++){
    if(ev[i].at - lastAt < 55 && i<ev.length-2) continue;
    out.push(ev[i]); lastAt=ev[i].at;
  }
  return out;
};

/* ---------- レース終了 ---------- */
G.endRace=function(){
  var self=this;
  setTimeout(function(){ self.rp.done=true; cancelAnimationFrame(self._raf); self.stopVoice(); Amb.stop(); self.showRaceResult(); }, 1800);
};

G.showRaceResult=function(){
  var c=this.course, sim=this.sim, f=this.field, i;
  var meRes=null;
  for(i=0;i<sim.result.length;i++) if(sim.result[i].idx===this.meIdx) meRes=sim.result[i];
  var prize = meRes.rank<=5 ? c.prize[meRes.rank-1] : 0;
  this.prize += prize;
  if(meRes.rank===1 && c.key!=='arima') this.crowns++;
  if(meRes.rank===1 && c.key==='arima') this.arimaWon=true;
  this.history.push({key:c.key, rank:meRes.rank, time:meRes.time, margin:meRes.margin,
    ninki:f[this.meIdx].ninki, prize:prize});
  this.lastRace={rank:meRes.rank, time:meRes.time};

  $('rrName').textContent=c.name;
  $('rrSub').textContent=c.track+'　'+c.surface+c.distance+'m　'+c.grade;
  $('rrRank').innerHTML='<span class="v'+(meRes.rank===1?'':' lose')+'">'+meRes.rank+'</span><span class="u">着</span>';
  var line='';
  if(meRes.rank===1) line='<span style="color:var(--gold);font-family:var(--f-ser);font-size:17px">勝利</span>';
  else line='<span class="tiny">勝ち馬から '+meRes.margin.toFixed(1)+' 秒差</span>';
  $('rrLine').innerHTML=line+'<div class="tiny" style="margin-top:3px">タイム '+fmtTime(meRes.time)
    +'　／　'+f[this.meIdx].ninki+'番人気</div>';

  var h='<table class="tbl"><tr><th>着</th><th>枠</th><th>番</th><th style="text-align:left">馬名</th><th>タイム</th><th>着差</th></tr>';
  for(i=0;i<sim.result.length;i++){
    var r=sim.result[i], fx=f[r.idx];
    h+='<tr'+(r.idx===this.meIdx?' class="me"':'')+'>'
      +'<td class="num ctr">'+r.rank+'</td>'
      +'<td><div class="waku w'+fx.waku+'">'+fx.waku+'</div></td>'
      +'<td class="num ctr">'+fx.uma+'</td>'
      +'<td style="text-align:left">'+(r.idx===this.meIdx?'<b style="color:var(--me)">'+esc(fx.name)+'</b>':esc(fx.name))+'</td>'
      +'<td class="num" style="text-align:right">'+fmtTime(r.time)+'</td>'
      +'<td class="num" style="text-align:right">'+(i===0?'—':bashin(r.margin*(c.distance/r.time)))+'</td></tr>';
  }
  h+='</table>';
  $('rrTable').innerHTML=h;

  var bonus=RANK_BONUS[meRes.rank]||0;
  var info='<div class="kv"><span class="k">獲得賞金</span><span class="v" style="color:var(--gold)">'
    +(prize?fmtMoney(prize):'なし')+'</span></div>'
    +'<div class="kv"><span class="k">総獲得賞金</span><span class="v">'+fmtMoney(this.prize)+'</span></div>';
  /* 上限まで振ってある能力に「上げてください」とは言わない */
  var ms = this.horse.stats;
  if(meRes.hadTrouble && ms.skill<100) info+='<div class="tiny" style="color:#c8886b;margin-top:5px">道中で不利があった（器用さを上げると減らせます）</div>';
  if(meRes.bigGate && ms.skill<100) info+='<div class="tiny" style="color:#c8886b;margin-top:3px">ゲートで出遅れた（器用さを上げると減らせます）</div>';
  if(ms.stamina<100){
    if(meRes.fuelLeft<-12) info+='<div class="tiny" style="color:#c8886b;margin-top:3px">終盤に完全に脚が上がった（スタミナ不足）</div>';
    else if(meRes.fuelLeft<0) info+='<div class="tiny" style="color:#c8886b;margin-top:3px">最後に少し苦しくなった（スタミナがやや不足）</div>';
  }

  var isLast = (this.raceIdx===3) || (this.raceIdx===2 && this.crowns<3);
  if(!isLast){
    info+='<div class="kv" style="margin-top:4px"><span class="k">次の育成ボーナス</span>'
      +'<span class="v" style="color:var(--gold)">'+(bonus?'＋'+bonus:'なし')+'</span></div>';
  }
  if(this.raceIdx===2 && this.crowns===3){
    info+='<div class="tiny ctr" style="color:var(--gold);margin-top:8px;font-size:12px;line-height:1.7">'
      +'三冠達成。<br>年末の<b>有真記念</b>への出走権を得ました。</div>';
  } else if(this.raceIdx===2 && this.crowns<3){
    info+='<div class="tiny ctr" style="margin-top:8px">三冠はなりませんでした。クラシック三戦を終えます。</div>';
  }
  $('rrInfo').innerHTML=info;

  $('rrNext').textContent = this.raceIdx===3 ? 'リザルトを見る'
    : (this.raceIdx===2 ? (this.crowns===3?'最終調整へ':'リザルトを見る') : '次の育成へ');
  this.show('rres');
  /* 勝ち馬から順に見たいので頭から表示し、自分が枠の外にいるときだけ届くぶん送る */
  var rw=$('rrTable');
  rw.scrollTop=0;
  this.scrollRowInto(rw, rw.querySelector('tr.me'), false);
};

/* ---------- 起動 ---------- */
(function(){
  /* 音楽は最初のタップまで鳴らせない（ブラウザの自動再生制限）。
     タップを待って AudioContext を起こし、その画面の曲を鳴らす。 */
  BGM.on = BGM.loadPref();
  G.syncBgmBtn();
  BGM.play(BGM_SCREEN.title);
  var unlock = function(){ BGM.unlock(); };
  document.addEventListener('pointerdown', unlock, true);
  document.addEventListener('touchstart', unlock, true);
  /* 画面を離れて戻ったとき、音が止まったままにならないようにする */
  document.addEventListener('visibilitychange', function(){
    if(!document.hidden) BGM.resume();
  });

  /* タイトルの紋章を canvas で描いていた処理はここにあったが、
     タイトル画面を一枚絵（.splash の background-image）にした時点で
     描画先の #silkCv が無くなり、動かなくなっていたので外した。
     同じ絵柄は icons/ のアイコン（favicon と maskable）に引き継いである。 */

  window.addEventListener('resize', function(){
    if(G.rp && !G.rp.done && document.getElementById('s-race').classList.contains('on')) G.fitCanvas();
  });
})();

</script>
