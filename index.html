<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0d1a14">

<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>三冠への道</title>

<style>
:root{
  --bg:#0c1511; --bg2:#122019; --panel:#16271e; --panel2:#1d3327;
  --line:#2c4a38; --line2:#3d6349;
  --txt:#eaf2ec; --dim:#9fb6a8; --dim2:#6f8a7b;
  --gold:#e8c268; --gold2:#b8902f;
  --red:#e2574c; --blue:#4d8fe0; --green:#48b472;
  --turf:#1f4b33; --turf2:#2a6344;
  --me:#ffd45e;
  --f-ser:"Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif JP",serif;
  --f-sans:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic","Noto Sans JP","Hiragino Kaku Gothic ProN",sans-serif;
  --f-num:"DIN Alternate","Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
/* iOS の 100vh はツールバーを含んだ高さなので、body が見えている範囲より縦に長くなり、
   どの画面もツールバーのぶんだけ余計にスクロールしていた。実際に見えている高さで測る */
@supports (height:100dvh){ html,body{height:100dvh} }
body{
  background:var(--bg); color:var(--txt); font-family:var(--f-sans);
  font-size:14px; line-height:1.5; overscroll-behavior:none;
  -webkit-text-size-adjust:100%; touch-action:manipulation;
}
/* ページ自体はスクロールさせない。アプリと同じく画面は固定で、
   中身が入りきらない画面だけがその画面の中でスクロールする。
   こうしないと iOS でツールバーの開閉に合わせて画面全体が上下に動く */
body{overflow:hidden}
#app{
  max-width:460px; margin:0 auto; height:100%; position:relative;
  background:linear-gradient(180deg,#0c1511 0%,#0e1a14 50%,#0c1511 100%);
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  display:flex; flex-direction:column; overflow:hidden;
}
.screen{display:none; padding:16px 14px 12px; animation:fade .25s ease}
/* overflow は hidden ではなく auto にしておく。
   hidden だと入りきらなかったぶんがスクロールバーも出ずに切り落とされ、
   「下が塗りつぶされている」ように見えてしまう。
   ふだんは下の伸縮領域が余りを吸うので、画面ごと動くことはない */
.screen.on{display:flex; flex-direction:column; flex:1 1 auto; min-height:0;
  overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain}
.screen.on > *{flex:0 0 auto}
/* 各画面でここだけが伸び縮みしてスクロールする。
   画面ごと動かすと、下のボタンが浮いたり画面の下が塗りつぶされたりするのでやめた */
#s-select > #styleHero,
#s-howto  > #howtoBody,
#s-hall   > #hallBody,
#s-result > #resBody,
#s-entry  > .entryTbl,
#s-rres   > .entryTbl{
  flex:1 1 auto; min-height:0;
  overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain;
}
#s-select > #styleHero{min-height:150px}
#s-howto  > #howtoBody, #s-hall > #hallBody, #s-result > #resBody{min-height:120px}
/* 育成（ハイアンドロー・振り分け）は中身が JS で入れ替わる。
   短いときは上下の余りを等分して、上だけが窮屈にならないようにする。
   中身がはみ出したときは auto マージンが 0 になるので、普通にスクロールできる */
#s-train > #trBody{margin-top:auto; margin-bottom:auto}
/* 「STEP 2 ・…」の行が右上の音楽ボタンの下に潜っていたので、その幅だけ空ける */
#s-train > #trBody > .card:first-child .sec{padding-right:42px}
/* レース中は馬券まで入れると縦に長い。切り落とさず画面ごと動かす */
#s-race.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---- 共通パーツ ---- */
h1,h2,h3{margin:0; font-weight:600}
.ttl{font-family:var(--f-ser); letter-spacing:.08em}
/* 右上には音楽ボタン（.bgmBtn）が固定で浮いているので、その幅ぶんだけ空けておく */
.hd{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px;
  padding-right:42px}
.hd .sub{font-size:11px;color:var(--dim2);letter-spacing:.1em}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px;margin-bottom:9px}
.card.tight{padding:9px}
.sec{font-size:11px;letter-spacing:.14em;color:var(--gold);margin-bottom:6px;font-weight:600}
.muted{color:var(--dim);font-size:12px;line-height:1.65}
.tiny{font-size:10.5px;color:var(--dim2);line-height:1.6}
.ctr{text-align:center}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

button{font-family:inherit;font-size:inherit;color:inherit;border:0;background:none;cursor:pointer}
.btn{
  display:block;width:100%;padding:14px;border-radius:11px;font-weight:700;font-size:15px;
  background:linear-gradient(180deg,#2d6b48,#1e4a31);border:1px solid #3f8a5e;
  color:#fff;letter-spacing:.06em;transition:transform .08s, filter .15s;
}
.btn:active{transform:scale(.98);filter:brightness(1.15)}
.btn.gold{background:linear-gradient(180deg,#e0b955,#a97f24);border-color:#f0d183;color:#241a06}
.btn.ghost{background:transparent;border:1px solid var(--line2);color:var(--dim)}
.btn.sm{padding:10px;font-size:13px}
.btn[disabled]{opacity:.35;pointer-events:none}
.row{display:flex;gap:9px}
/* 以前は position:sticky で画面の下端に貼り付けていたが、
   スクロールから外れて浮いて見えるうえ、下に敷いたグラデーションが
   画面の下を塗りつぶしてしまうのでやめた。
   いまは各画面が収まるようにしてあるので、普通に並べるだけでよい */
.stick{position:static;filter:none}
.row.stick{position:static;margin-left:0;margin-right:0;padding:0;background:none;filter:none}
.row>*{flex:1}

/* ---- タイトル（起動スプラッシュ） ---- */
#s-title{padding:0;overflow:hidden}
.splash{
  position:relative;
  /* #app がノッチとホームバーぶんの余白を持っているので、その分を引かないと
     画面より縦に長くなり、タイトルが上下にスクロールしてしまう */
  min-height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));
  min-height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));

  background-size:100% auto; background-position:center top; background-repeat:no-repeat;
  display:flex; flex-direction:column; justify-content:flex-end;
  cursor:pointer; -webkit-user-select:none; user-select:none;
}
.splash-foot{
  /* 下端ギリギリだとブラウザのツールバーと干渉して押しにくい。
     ホームバーぶんの余白は #app 側ですでに取ってあるのでここでは足さない */
  padding:188px 20px 32px;
  text-align:center;
  background:linear-gradient(to top,
    rgba(8,20,14,.97) 0%, rgba(8,20,14,.93) 26%,
    rgba(8,20,14,.72) 56%, rgba(8,20,14,.28) 82%, rgba(8,20,14,0) 100%);
}
.tapStart{
  display:flex; align-items:center; justify-content:center; gap:13px;
  font-family:var(--f-ser); font-size:16px; font-weight:600;
  letter-spacing:.40em; text-indent:.40em; color:#f7e9bd;
  text-shadow:0 1px 3px rgba(0,0,0,.95), 0 3px 16px rgba(0,0,0,.8);
  animation:tapPulse 1.9s ease-in-out infinite;
}
.tapStart i{display:block;height:1px;width:38px;background:rgba(243,225,174,.75);flex:none}
@keyframes tapPulse{0%,100%{opacity:1}50%{opacity:.52}}
.splash-shoe{margin:9px auto 0;display:block;opacity:.85}
.splash-links{margin-top:14px;font-size:13px;color:rgba(214,230,218,.78);letter-spacing:.08em}
.splash-links button{color:inherit;font-size:inherit;padding:11px 18px;letter-spacing:inherit}
.splash-links button:active{color:var(--gold)}
.splash-links .sep{opacity:.4}
#title{padding-top:52px;text-align:center}
.logo{font-family:var(--f-ser);font-size:40px;letter-spacing:.14em;line-height:1.25;
  background:linear-gradient(180deg,#fff6dc,#e8c268 45%,#9d7620);-webkit-background-clip:text;background-clip:text;color:transparent;
  text-shadow:0 2px 14px rgba(232,194,104,.14)}
.logo-sub{font-size:11px;letter-spacing:.42em;color:var(--dim2);margin:8px 0 2px}
.silks{width:92px;height:92px;margin:22px auto 20px;position:relative}

/* ---- 装飾枠 ---- */
/* ハイアンドローは札と状態表で縦に長くなるので、この画面だけ枠の余白を詰める */
#s-train .orn{padding:11px;margin-bottom:9px}
#s-train .roundPips{margin-bottom:4px}
.orn{position:relative;border:1px solid rgba(232,194,104,.42);border-radius:13px;
  background:linear-gradient(180deg,#15291e 0%,#0e1d15 100%);
  box-shadow:0 8px 26px rgba(0,0,0,.45);padding:13px;margin-bottom:12px}
.orn::after{content:'';position:absolute;inset:4px;border:1px solid rgba(232,194,104,.14);
  border-radius:9px;pointer-events:none}
.cn{position:absolute;width:13px;height:13px;pointer-events:none;border:2px solid var(--gold);opacity:.85}
.cn.tl{top:-1px;left:-1px;border-right:0;border-bottom:0;border-radius:13px 0 0 0}
.cn.tr{top:-1px;right:-1px;border-left:0;border-bottom:0;border-radius:0 13px 0 0}
.cn.bl{bottom:-1px;left:-1px;border-right:0;border-top:0;border-radius:0 0 0 13px}
.cn.br{bottom:-1px;right:-1px;border-left:0;border-top:0;border-radius:0 0 13px 0}

/* ---- 装飾見出し ---- */
.ornHead{text-align:center;margin:0 0 9px}
.ornHead .h{display:flex;align-items:center;gap:12px;justify-content:center;margin-top:1px}
.ornHead .h i{height:1px;flex:1;max-width:58px;background:linear-gradient(90deg,transparent,rgba(232,194,104,.75))}
.ornHead .h i:last-child{transform:scaleX(-1)}
.ornHead .t{font-family:var(--f-ser);font-size:21px;letter-spacing:.12em;white-space:nowrap;
  background:linear-gradient(180deg,#fff6dc,#e8c268 55%,#a97f24);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.ornHead .s{font-size:10px;letter-spacing:.22em;color:var(--dim2);margin-top:5px}

/* ---- 脚質セレクタ ---- */
/* 馬選択は1画面に収めたいので、この画面だけ余白を詰める */
#s-select > .ornHead{margin-bottom:2px}
#s-select .namecard{padding:11px}
#s-select #nameMsg{margin-top:6px;font-size:10px}
#s-select .btnOrn{padding:13px}
.segs{display:flex;gap:8px;margin-bottom:10px}
.seg{flex:1;position:relative;border:1.5px solid rgba(232,194,104,.26);border-radius:11px;
  padding:9px 4px 8px;background:linear-gradient(180deg,#16281d,#0f1f17);
  text-align:center;transition:all .2s}
.seg:active{transform:scale(.97)}
.seg .ic{display:block;margin:0 auto 1px;color:rgba(232,194,104,.4)}
.seg .nm{font-family:var(--f-ser);font-size:15px;letter-spacing:.1em;color:var(--dim)}
.seg.sel{border-color:var(--gold);box-shadow:0 0 18px rgba(232,194,104,.22),0 3px 12px rgba(0,0,0,.5)}
.seg.sel .nm{color:#fff}
.seg.sel::after{content:'';position:absolute;left:50%;bottom:-8px;transform:translateX(-50%);
  width:0;height:0;border:8px solid transparent;border-top-color:var(--gold)}

/* ---- 脚質ヒーローカード ---- */
.hero2{padding:0;overflow:hidden;animation:heroIn .24s ease}
@keyframes heroIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.hero2::after{inset:4px;border-radius:9px}
.banner{position:relative;height:66px;overflow:hidden;border-radius:12px 12px 0 0}
.banner img{width:100%;height:100%;object-fit:cover;object-position:center 46%;display:block}
.banner .tint{position:absolute;inset:0}
.banner .fade{position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(13,27,20,.78) 0%,rgba(13,27,20,.12) 46%,rgba(13,27,20,.93) 100%)}
.banner .plate{position:absolute;left:14px;top:12px;display:flex;align-items:center;gap:8px}
.banner .plate .t{font-family:var(--f-ser);font-size:21px;letter-spacing:.1em;color:#fff;
  text-shadow:0 2px 10px rgba(0,0,0,.95)}
.typeBadge{position:absolute;right:13px;top:14px;display:inline-flex;align-items:center;gap:5px;
  padding:5px 11px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:.06em;
  border:1px solid;background:rgba(8,18,13,.86)!important;
  box-shadow:0 2px 10px rgba(0,0,0,.6)}
.hero2 .stats{display:flex;gap:9px;padding:7px 12px 0;align-items:center}
.hero2 canvas{flex:none;width:98px;height:98px}
.hero2 .list{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.statRow{display:flex;align-items:center;gap:7px;padding:4px 8px;border-radius:8px;
  background:rgba(255,255,255,.035);border:1px solid rgba(232,194,104,.13)}
.statRow .nm{flex:1;font-size:11.5px;color:var(--dim)}
.statRow .v{font-family:var(--f-num);font-size:12.5px;color:var(--txt)}
.posbar2{display:flex;align-items:center;gap:8px;padding:7px 13px 0}
.posbar2 .lab{font-size:10px;color:var(--dim2);flex:none}
.posbar2 .track{flex:1;height:15px;border-radius:8px;background:#0a120e;position:relative;
  border:1px solid rgba(232,194,104,.18)}
.posbar2 .fill{position:absolute;top:1px;bottom:1px;border-radius:7px}
.posbar2 .mk{position:absolute;top:50%;transform:translate(-50%,-50%);color:#fff;
  filter:drop-shadow(0 1px 3px rgba(0,0,0,.8))}
.hero2 .desc{padding:10px 14px 0;font-size:11.5px;line-height:1.58;color:var(--dim)}
.hero2 .weak{padding:4px 14px 8px;font-size:10.5px;line-height:1.5;color:#8a6f52}

/* 飾り罫つきの見出し（馬名など、中央に置きたいもの） */
.secOrn{display:flex;align-items:center;justify-content:center;gap:10px;margin:0 0 9px}
.secOrn i{height:1px;flex:1;max-width:60px;
  background:linear-gradient(90deg,transparent,rgba(232,194,104,.75))}
.secOrn i:last-child{transform:scaleX(-1)}
.secOrn span{font-size:12px;letter-spacing:.24em;font-weight:600;white-space:nowrap;
  background:linear-gradient(180deg,#fff6dc,#e8c268 55%,#b8902f);
  -webkit-background-clip:text;background-clip:text;color:transparent}

/* ---- 馬名入力 ---- */
.namecard .nameRow{display:flex;gap:9px;align-items:stretch}
.nameRow input{flex:1;min-width:0;padding:10px;border-radius:10px;
  border:1px solid rgba(232,194,104,.3);background:#0a120e;color:var(--txt);
  font-size:17px;font-family:var(--f-ser);letter-spacing:.1em;text-align:center}
.nameRow input:focus{outline:none;border-color:var(--gold)}
.diceBtn{flex:none;width:64px;border-radius:10px;border:1px solid rgba(232,194,104,.4);
  background:linear-gradient(180deg,#1e3528,#13251b);color:var(--gold);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:19px}
.diceBtn span{font-size:8.5px;letter-spacing:.04em}
.diceBtn:active{transform:scale(.95);background:var(--line2)}

/* ---- 装飾ボタン ---- */
.btnOrn{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;
  padding:15px;border-radius:11px;font-weight:700;font-size:16px;letter-spacing:.08em;
  background:linear-gradient(180deg,#f2d78e,#cb9e35 55%,#a97f24);
  border:1px solid #f9e8b6;color:#241a06;
  box-shadow:0 4px 20px rgba(232,194,104,.26);transition:transform .08s,filter .15s}
.btnOrn:active{transform:scale(.985);filter:brightness(1.08)}

/* ---- 能力バー ---- */
.stat{display:flex;align-items:center;gap:8px;margin:4px 0}
.stat .lb{width:52px;font-size:11.5px;color:var(--dim);flex:none}
.stat .bar{flex:1;height:9px;background:#0a120e;border-radius:5px;overflow:hidden;position:relative}
.stat .bar i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,#2f7a50,#5fc98a);transition:width .45s cubic-bezier(.2,.8,.2,1)}
.stat .bar u{position:absolute;top:0;height:100%;background:rgba(255,212,94,.5);transition:all .3s}
.stat .gr{width:48px;text-align:right;font-family:var(--f-num);font-size:12px;flex:none}
.stat .rngv{width:62px;text-align:right;font-family:var(--f-num);font-size:11.5px;color:var(--dim);flex:none}
.bar.rng u{position:absolute;top:0;height:100%;border-radius:5px;
  background:linear-gradient(90deg,#2f7a50,#5fc98a);opacity:.5}
.bar.rng b{position:absolute;top:-3px;width:2px;height:15px;background:var(--gold);border-radius:1px}
.g-S{color:#ff9ad5}.g-A{color:#ff8a6b}.g-B{color:#ffc861}.g-C{color:#7ee08f}.g-D{color:#6fc2e8}.g-E{color:#9fb6a8}.g-F{color:#7b8f82}
.gv{font-family:var(--f-num);font-size:10px;color:var(--dim2);margin-left:3px}

/* ---- 宝箱 ---- */
.chests{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin:4px 0 10px}
.chest{
  border:1.5px solid var(--line);border-radius:10px;padding:9px 3px 7px;text-align:center;
  background:var(--panel);transition:all .15s
}
.chest:active{transform:scale(.95)}
.chest.open{border-color:var(--gold);background:var(--panel2)}
.chest.dim{opacity:.32}
.chest .ic{font-size:21px;line-height:1.15}
.chest .nm{font-size:9.5px;color:var(--dim);margin-top:3px;letter-spacing:.02em}
.chest .hint{font-size:9px;color:var(--gold2);margin-top:2px;font-family:var(--f-num)}

/* ---- ハイアンドロー ---- */
.hlStage{position:relative;padding:11px 11px 12px;margin-bottom:9px}
.roundPips{display:flex;justify-content:center;gap:9px;margin:0 0 7px}
.roundPips i{width:9px;height:9px;transform:rotate(45deg);background:#20362a;
  border:1px solid var(--line2);transition:all .25s}
.roundPips i.on{background:var(--gold);border-color:var(--gold)}
.roundPips i.cur{background:transparent;border-color:var(--gold);
  box-shadow:0 0 0 4px rgba(232,194,104,.14)}
.hlMeta{text-align:center;font-size:10.5px;color:var(--dim2);letter-spacing:.04em;margin-bottom:8px}
.hlMeta b{color:var(--gold);font-family:var(--f-num);font-size:12.5px}

.cardRow{display:flex;align-items:center;justify-content:center;gap:16px;margin:2px 0}
.pcard2{width:98px;height:110px;border-radius:13px;position:relative;flex:none;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(160deg,#fdfaf0,#e9e0c8);
  border:2px solid #fff;box-shadow:0 10px 26px rgba(0,0,0,.6)}
.pcard2 .big{font-family:var(--f-num);font-size:64px;font-weight:700;color:#15321f;line-height:1}
.pcard2 .cnr{position:absolute;font-family:var(--f-num);font-size:15px;font-weight:700;color:#15321f}
.pcard2 .cnr.a{top:7px;left:10px}
.pcard2 .cnr.b{bottom:7px;right:10px}
.pcard2.back{background:linear-gradient(160deg,#235640,#0f2a1d);border-color:#58a97b}
.pcard2.back .big{color:var(--gold2);font-size:50px}
.pcard2.back::before{content:'';position:absolute;inset:9px;border-radius:8px;
  border:1px solid rgba(232,194,104,.34);
  background:repeating-linear-gradient(45deg,rgba(232,194,104,.08) 0 5px,transparent 5px 11px)}
/* めくれて表になった裏の札 */
.pcard2.open{background:linear-gradient(160deg,#fdfaf0,#e9e0c8);border-color:var(--gold)}
.pcard2.open::before{display:none}
.pcard2.open .big{color:#15321f;font-size:64px}
.pcard2.open .cnr{color:#15321f}
.pcard2.flip{animation:cardFlip .45s cubic-bezier(.2,.8,.2,1)}
@keyframes cardFlip{0%{transform:rotateY(90deg) scale(.9)}58%{transform:rotateY(-8deg) scale(1.04)}100%{transform:none}}
.pcard2.hit{animation:cardFlip .45s cubic-bezier(.2,.8,.2,1), hitGlow .75s ease-out .2s}
@keyframes hitGlow{0%{box-shadow:0 0 0 0 rgba(232,194,104,.75),0 10px 26px rgba(0,0,0,.6)}
  100%{box-shadow:0 0 0 30px rgba(232,194,104,0),0 10px 26px rgba(0,0,0,.6)}}
.pcard2.miss{animation:cardFlip .45s cubic-bezier(.2,.8,.2,1), shake .4s ease .2s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}
  40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.vsMark{width:34px;flex:none;text-align:center;
  font-family:var(--f-ser);font-size:12px;letter-spacing:.2em;color:var(--dim2)}
.cardCap{display:flex;justify-content:center;gap:16px;margin-top:4px}
.cardCap span{width:98px;text-align:center;font-size:10px;color:var(--dim2);letter-spacing:.08em}
.cardCap i{width:34px;flex:none}   /* VS と同じ幅。札の真下に来るようにする */

.pot2{text-align:center;margin:8px 0 2px}
.pot2 .lab{font-size:9.5px;letter-spacing:.2em;color:var(--dim2)}
.pot2 .v{font-family:var(--f-num);font-size:38px;font-weight:700;line-height:1.05;
  background:linear-gradient(180deg,#fff6dc,#e8c268 48%,#b8902f);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 2px 12px rgba(232,194,104,.34))}
.pot2 .v.zero{background:none;color:#4e6a5b;filter:none}
/* 振り分け画面は、のこりと刻みボタンを一行に収める */
.potLine{display:flex;align-items:center;justify-content:center;gap:16px;margin:2px 0}
.potLine .steps{display:flex;gap:6px}
.pot2.inline{margin:0;display:flex;align-items:baseline;gap:8px}
.pot2.inline .lab{letter-spacing:.14em}
.pot2.inline .v{font-size:40px}
.streak{display:inline-flex;align-items:center;gap:7px;margin-top:8px;padding:5px 14px;
  border-radius:20px;background:rgba(232,194,104,.12);border:1px solid rgba(232,194,104,.45);
  font-size:11px;color:var(--gold);animation:streakPulse 1.6s ease-in-out infinite}
@keyframes streakPulse{0%,100%{box-shadow:0 0 0 0 rgba(232,194,104,0)}
  50%{box-shadow:0 0 14px 0 rgba(232,194,104,.3)}}
.streak .mul{font-family:var(--f-num);font-size:15px;font-weight:700}
.streak .stars{letter-spacing:1px}

.betRow{display:flex;gap:10px;margin-top:11px}
.bet{flex:1;position:relative;border-radius:13px;padding:9px 8px 9px;text-align:center;
  border:1.5px solid;overflow:hidden;transition:transform .08s,filter .15s}
.bet:active{transform:scale(.97);filter:brightness(1.15)}
.bet .dir{font-size:19px;font-weight:800;letter-spacing:.05em}
.bet .risk{font-size:10px;margin-top:3px;letter-spacing:.1em;opacity:.9}
.bet .gauge{height:5px;border-radius:3px;background:rgba(0,0,0,.45);margin:6px 12px 0;overflow:hidden}
.bet .gauge i{display:block;height:100%;border-radius:3px}
.bet .pct{font-size:9.5px;color:var(--dim2);margin-top:4px;font-family:var(--f-num)}
.bet .pay{font-family:var(--f-num);font-size:25px;font-weight:700;margin-top:3px;line-height:1}
.bet.hi{border-color:#e2574c;background:linear-gradient(180deg,rgba(226,87,76,.22),rgba(226,87,76,.06))}
.bet.hi .dir,.bet.hi .pay{color:#ff8b7f}
.bet.lo{border-color:#5aa9e6;background:linear-gradient(180deg,rgba(90,169,230,.22),rgba(90,169,230,.06))}
.bet.lo .dir,.bet.lo .pay{color:#8ccaf5}

.cashBtn{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;
  padding:14px;border-radius:11px;font-size:15px;font-weight:700;letter-spacing:.06em;
  border:1.5px solid var(--gold);color:var(--gold);
  background:linear-gradient(180deg,rgba(232,194,104,.16),rgba(232,194,104,.05))}
.cashBtn:active{transform:scale(.985);filter:brightness(1.2)}
.hlWarn{text-align:center;font-size:10.5px;color:#c8886b;margin-top:9px;line-height:1.6}
.hlResult{text-align:center;font-family:var(--f-ser);font-size:26px;letter-spacing:.1em;margin:12px 0 4px}
.hlAnswer{text-align:center;font-size:11.5px;color:var(--dim);margin-bottom:10px;line-height:1.7}

/* ---- ラウンド表示 ---- */
.roundBig{display:flex;align-items:baseline;justify-content:center;gap:9px;margin:2px 0 7px}
.roundBig .lab{font-size:10px;letter-spacing:.24em;color:var(--dim2);align-self:center}
.roundBig .num{font-family:var(--f-num);font-size:38px;font-weight:700;line-height:1;
  background:linear-gradient(180deg,#fff6dc,#e8c268 52%,#b8902f);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.roundBig .sep{font-family:var(--f-num);font-size:20px;color:var(--dim2)}
.roundBig .tot{font-family:var(--f-num);font-size:22px;color:var(--dim)}

/* ---- 現在の能力パネル ---- */
.statusCard{padding:9px 11px 9px}
.stGrid{display:grid;grid-template-columns:1fr 1fr;gap:3px 12px}
.stCell{display:flex;align-items:center;gap:6px;padding:2px 0}
.stCell .ic{flex:none;opacity:.85}
.stCell .lb{font-size:11px;color:var(--dim)}
.stCell .gr{margin-left:auto;font-family:var(--f-num);font-size:12.5px}
.stHead{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:7px;
  padding-bottom:8px;border-bottom:1px solid rgba(232,194,104,.18)}
.stHead i{height:1px;flex:1;max-width:52px;
  background:linear-gradient(90deg,transparent,rgba(232,194,104,.75))}
.stHead i:last-child{transform:scaleX(-1)}
.stHead .nm{font-family:var(--f-ser);font-size:17px;letter-spacing:.1em;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;
  background:linear-gradient(180deg,#fff6dc,#e8c268 55%,#b8902f);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.stFoot .sty{padding:1px 8px;border-radius:11px;font-size:10px}
.stRow{display:flex;align-items:center;gap:8px;margin:4px 0}
.stRow .ic{flex:none;opacity:.85}
.stRow .lb{width:48px;font-size:11px;color:var(--dim);flex:none}
.stRow .bar{flex:1;height:7px;background:#0a120e;border-radius:4px;overflow:hidden;
  box-shadow:inset 0 1px 2px rgba(0,0,0,.5)}
.stRow .bar i{display:block;height:100%;border-radius:4px;
  background:linear-gradient(90deg,#2f7a50,#5fc98a);transition:width .4s}
.stRow .gr{width:44px;text-align:right;font-family:var(--f-num);font-size:11.5px;flex:none}
.stFoot{display:flex;justify-content:space-between;align-items:baseline;margin-top:7px;
  padding-top:8px;border-top:1px solid rgba(232,194,104,.18);font-size:11px;color:var(--dim2)}
.stFoot b{font-family:var(--f-num);font-size:13px;color:var(--txt)}
.stFoot .nx{color:var(--gold);font-family:var(--f-ser);font-size:13px;letter-spacing:.06em}

/* ---- あきらめる ---- */
.giveUp{display:block;width:100%;margin-top:14px;padding:13px;border-radius:10px;
  border:1px solid rgba(200,136,107,.42);background:transparent;
  color:#9a7c5c;font-size:13px;font-weight:600;letter-spacing:.06em}
.giveUp:active{background:rgba(200,136,107,.1)}
.giveUpBox{margin-top:14px;padding:13px;border-radius:11px;
  border:1px solid rgba(226,87,76,.5);background:rgba(226,87,76,.08);text-align:center}
.giveUpBox p{margin:0 0 11px;font-size:12px;line-height:1.7;color:#e8c0b4}
.giveUpBox .row{display:flex;gap:9px}
.giveUpBox button{flex:1;padding:11px;border-radius:9px;font-size:13px;font-weight:700}
.giveUpBox .no{border:1px solid var(--line2);color:var(--dim);background:transparent}
.giveUpBox .yes{border:1px solid #e2574c;color:#fff;background:rgba(226,87,76,.5)}

/* ---- この馬の能力（初期値 → 現在） ---- */
.grow .gh,.grow .gr{display:grid;grid-template-columns:1fr 70px 20px 70px;align-items:center}
.grow .gh{font-size:9.5px;letter-spacing:.14em;color:var(--dim2);
  padding-bottom:4px;border-bottom:1px solid #1b2e23}
.grow .gh span{text-align:center}
.grow .gr{padding:3px 0;border-bottom:1px solid #16261d}
.grow .n{font-size:12.5px;color:var(--dim)}
.grow .a,.grow .b{text-align:center;font-family:var(--f-num);font-size:14px;color:var(--dim2)}
.grow .a b,.grow .b b{font-family:var(--f-num);font-size:12px;margin-right:5px}
.grow .b{color:var(--txt)}
.grow .b.up{color:var(--gold)}
.grow .ar{text-align:center;font-size:11px;color:var(--dim2)}
.grow .tot{border-bottom:0;border-top:1px solid #1b2e23;margin-top:3px}
.grow .tot .n{font-size:11px;letter-spacing:.1em}
.grow .tot .a,.grow .tot .b{font-size:15px}

/* ---- 次走 ---- */
.nextRace .nrTop{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.nextRace .lb{font-size:10px;letter-spacing:.14em;color:var(--gold);flex:none}
.nextRace .nm{font-family:var(--f-ser);font-size:17px;letter-spacing:.08em}
.nextRace .cd{font-size:10px;letter-spacing:.08em;color:var(--dim2);margin-left:auto}
.nextRace .nrLab{font-size:9.5px;letter-spacing:.18em;color:var(--dim2);margin:7px 0 5px}
.nextRace .chips{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.nextRace .chips b{padding:4px 11px;border-radius:14px;font-size:12px;font-weight:600;
  border:1px solid var(--line2);color:var(--dim);background:var(--panel2)}
.nextRace .chips b.top{border-color:var(--gold);color:#17251d;font-weight:700;
  background:linear-gradient(180deg,#f2d896,#d8ac4c)}
.nextRace .chips i{font-style:normal;font-size:11px;color:var(--dim2)}

/* ポイントが余ったままの確認（あきらめ確認と同じ作りの金色版） */
.giveUpBox.ask{border-color:rgba(232,194,104,.5);background:rgba(232,194,104,.08);
  margin-top:10px;padding:11px}
.giveUpBox.ask p{margin:0 0 9px;line-height:1.55}
.giveUpBox.ask p{color:#e6dcc4}
.giveUpBox.ask p b{font-family:var(--f-num);font-size:16px;color:var(--gold)}
.giveUpBox.ask .yes{border-color:var(--gold);color:#17251d;font-weight:700;
  background:linear-gradient(180deg,#f2d896,#d8ac4c)}

/* 全能力が上限に達しているときの案内 */
.capNote{margin:9px 0 2px;padding:8px 11px;border-radius:10px;text-align:center;
  border:1px solid rgba(232,194,104,.4);background:rgba(232,194,104,.09);
  font-size:11.5px;line-height:1.75;color:var(--gold)}

/* ---- 振り分け ---- */
.alloc{display:flex;align-items:center;gap:7px;margin:6px 0}
.alloc .lb{width:50px;font-size:11.5px;color:var(--dim);flex:none}
.alloc .bar{flex:1;height:8px;background:#0a120e;border-radius:4px;overflow:hidden;position:relative}
.alloc .bar i{display:block;height:100%;background:linear-gradient(90deg,#2f7a50,#5fc98a)}
.alloc .bar u{position:absolute;top:0;height:100%;background:rgba(255,212,94,.55)}
.alloc .val{width:58px;text-align:right;font-family:var(--f-num);font-size:12px;flex:none}
.pm{display:flex;gap:5px;flex:none}
.pm button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line2);background:var(--panel2);
  font-size:16px;font-weight:700;line-height:1;color:var(--txt)}
.pm button:active{background:var(--line2)}
.pm button[disabled]{opacity:.25}

/* ---- 音楽の入切（どの画面でも右上に出したままにする） ---- */
.bgmBtn{position:fixed;z-index:60;width:34px;height:34px;border-radius:50%;
  top:calc(env(safe-area-inset-top,0px) + 9px);right:10px;
  border:1px solid var(--line2);background:rgba(10,18,14,.6);
  -webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px);
  font-size:15px;line-height:1;color:var(--dim2);
  display:flex;align-items:center;justify-content:center}
.bgmBtn.on{color:var(--gold);border-color:rgba(232,194,104,.45)}
.bgmBtn.off::after{content:'';position:absolute;left:7px;right:7px;top:50%;
  height:1.5px;background:var(--dim2);transform:rotate(-38deg)}

/* ---- 出走表 ---- */
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{font-size:9.5px;color:var(--dim2);font-weight:500;padding:4px 2px;border-bottom:1px solid var(--line);letter-spacing:.06em}
.tbl td{padding:6px 2px;border-bottom:1px solid #1b2e23;vertical-align:middle}
.tbl tr.me td{background:rgba(255,212,94,.09)}
.waku{width:21px;height:21px;border-radius:3px;display:flex;align-items:center;justify-content:center;
  font-family:var(--f-num);font-size:11px;font-weight:700}
.w1{background:#f5f5f5;color:#111}.w2{background:#1c1c1c;color:#fff;border:1px solid #555}
.w3{background:#d6383c;color:#fff}.w4{background:#2a63c7;color:#fff}
.w5{background:#f0d23a;color:#111}.w6{background:#2e9e5b;color:#fff}
.w7{background:#f08a24;color:#111}.w8{background:#ef9bbd;color:#111}
.ninki{font-family:var(--f-num);font-size:11px;color:var(--dim)}
/* 18頭を枠に収めてスクロール。見出しは上に貼り付いたまま残す */
.entryTbl{position:relative;padding:8px 6px}
.tblWrap{max-height:270px;overflow-y:auto;-webkit-overflow-scrolling:touch}
/* 表の高さは画面の余りに合わせる。出走表は他に置くものが少ないぶん多く見せる。
   dvh を使うのは、スマホのツールバーを差し引いた実際の高さで測るため。 */
#s-entry .tblWrap{max-height:330px}
#s-rres  .tblWrap{max-height:290px}
@supports (height:100dvh){
  #s-entry .tblWrap{max-height:min(440px, max(200px, calc(100dvh - 404px)))}
  #s-rres  .tblWrap{max-height:min(400px, max(190px, calc(100dvh - 480px)))}
}
/* 画面を flex で組むようにしたので、表は決め打ちの高さではなく
   「画面の余り」をそのまま使う。スクロールするのはこの表の中だけ */
#s-entry > .entryTbl, #s-rres > .entryTbl{
  display:flex; flex-direction:column; overflow:hidden; min-height:110px}
#s-entry .tblWrap, #s-rres .tblWrap{flex:1 1 auto; min-height:0; max-height:none}
.tblWrap .tbl th{position:sticky;top:0;z-index:2;background:var(--panel);
  box-shadow:0 1px 0 var(--line)}
.entryTbl::after{content:'';position:absolute;left:7px;right:7px;bottom:1px;height:26px;
  pointer-events:none;border-radius:0 0 11px 11px;
  background:linear-gradient(180deg,rgba(22,39,30,0),#16271e)}
.ninki.top{color:var(--gold);font-weight:700}

/* ---- レース画面 ---- */
#race{padding:8px 10px 18px}
/* ---- レース名の装飾見出し ---- */
.raceHead{text-align:center;margin:0 0 7px}
.raceHead .h{display:flex;align-items:center;gap:11px;justify-content:center}
.raceHead .h i{height:1px;flex:1;max-width:48px;
  background:linear-gradient(90deg,transparent,rgba(232,194,104,.8))}
.raceHead .h i:last-child{transform:scaleX(-1)}
.raceHead .t{font-family:var(--f-ser);font-size:23px;letter-spacing:.14em;white-space:nowrap;
  background:linear-gradient(180deg,#fff6dc,#e8c268 52%,#a97f24);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 1px 6px rgba(232,194,104,.25))}
.raceHead .s{font-size:10px;letter-spacing:.16em;color:var(--dim2);margin-top:4px}

/* ---- 単勝馬券（実際の勝馬投票券の券面を参考にした意匠） ---- */
.ticket{position:relative;width:100%;margin-top:14px;aspect-ratio:1330/797;
  background:#fcfcf6;color:#0c0c0c;overflow:hidden;border-radius:3px;
  font-family:var(--f-sans);font-weight:800;line-height:1;
  font-size:10px;
  box-shadow:0 12px 30px rgba(0,0,0,.6),0 0 0 1px rgba(0,0,0,.4)}
#rcTicket{container-type:inline-size}
@supports (font-size:1cqw){.ticket{font-size:2.88cqw}}
.ticket .bd{position:absolute;inset:0;background:linear-gradient(90deg,
  transparent 0 5.8%,#b2e9ec 5.8% 9.8%,transparent 9.8% 33.2%,#b2e9ec 33.2% 38.2%,transparent 38.2%)}

.ticket .in{position:absolute;inset:0;padding:2.9% 2.8% 2.1em;display:flex;gap:1.4%}

.tkL{width:38%;display:flex;flex-direction:column;min-width:0}
.tkL>*,.tkR>*{flex:none}
.tkDate{font-size:1em;letter-spacing:.01em}
.tkTrack{font-size:2.35em;letter-spacing:.34em;margin:.06em 0 .1em;text-indent:.08em}
.tkRno{display:flex;align-items:center;gap:.22em;font-size:1.45em}
.tkRno b{background:#0c0c0c;color:#fcfcf6;font-family:var(--f-num);font-weight:700;
  font-size:1.3em;padding:.04em .2em .06em;letter-spacing:.02em}
.tkQr{display:flex;gap:.45em;margin:.45em 0 .5em}
.tkQr img{width:3.95em;height:3.95em;display:block;image-rendering:pixelated}
.tkKai{font-size:1.15em;letter-spacing:.01em}
.tkTtl{font-size:1.15em;margin-top:.3em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tkFoot{margin-top:auto;font-size:1em;line-height:1.35;letter-spacing:.05em}

.tkM{width:15%;flex:none;border:.14em solid #0c0c0c;display:flex;flex-direction:column;
  align-items:center;padding:.35em 0;margin-bottom:.2em}
.tkM .en{font-size:.92em;font-family:var(--f-num);font-weight:700;letter-spacing:.02em}
.tkM .bt{writing-mode:vertical-rl;font-size:2.7em;letter-spacing:.06em;margin:auto 0}

.tkR{flex:1;display:flex;flex-direction:column;min-width:0;padding-top:.15em}
.tkRow{display:flex;align-items:center;gap:.55em}
.tkR .nm{font-family:var(--f-num);font-weight:700;font-size:2.7em;width:1.45em;height:1.2em;
  display:flex;align-items:center;justify-content:center;border:.07em solid #0c0c0c;flex:none;
  background:#fcfcf6;color:#0c0c0c}
.tkYen{font-family:var(--f-num);font-weight:700;font-size:1.85em;display:flex;align-items:baseline}
.tkYen i{font-style:normal;font-size:.7em;letter-spacing:-.1em;margin-right:.18em}
.tkYen em{font-style:normal;font-size:.6em;margin-left:.1em}
.tkHorse{font-size:1.4em;letter-spacing:.03em;margin-top:.8em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tkSum{margin-top:auto;font-size:.95em;letter-spacing:.01em;text-align:right;white-space:nowrap}
.tkSum i{font-style:normal;font-size:.8em;letter-spacing:-.1em;margin:0 .1em}
.tkSer{position:absolute;right:2.8%;bottom:1.3%;font-size:.88em;font-family:var(--f-num);
  font-weight:600;letter-spacing:.03em;display:flex;gap:.8em;white-space:nowrap}
.rem{text-align:center;font-family:var(--f-num);font-size:12px;color:var(--gold);letter-spacing:.1em;margin-bottom:3px}
.cv{display:block;width:100%;border-radius:10px;background:#0a120e;border:1px solid var(--line)}
.spd{display:flex;gap:7px;margin:9px 0}
.spd button{flex:1;padding:9px 4px;border-radius:9px;border:1px solid var(--line);background:var(--panel);
  font-size:11.5px;color:var(--dim);letter-spacing:.04em}
.spd button.on{border-color:var(--gold);color:var(--gold);background:var(--panel2)}
.spd button[disabled]{opacity:.3}
.live{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:5px 8px}
.live .ln{display:flex;align-items:center;gap:7px;padding:3.5px 0;font-size:12px;border-bottom:1px solid #1b2e23}
.live .ln:last-child{border-bottom:0}
.live .ln.me{color:var(--me);font-weight:700}
.live .rk{width:15px;font-family:var(--f-num);font-size:12px;color:var(--dim2);flex:none;text-align:center}
.live .ln.me .rk{color:var(--me)}
.live .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.live .gap{font-family:var(--f-num);font-size:10.5px;color:var(--dim2);flex:none}
.tele{min-height:34px;margin:7px 0;padding:8px 44px 8px 10px;border-radius:9px;background:#0a120e;
  border:1px solid var(--line);font-size:12.5px;line-height:1.5;color:#dbe8dd;position:relative}
.voiceBtn{position:absolute;right:7px;top:50%;transform:translateY(-50%);
  width:30px;height:30px;border-radius:8px;border:1px solid var(--line2);
  background:var(--panel);font-size:14px;line-height:1;color:var(--dim);
  display:flex;align-items:center;justify-content:center;filter:grayscale(1) opacity(.6)}
.voiceBtn.on{border-color:var(--gold);filter:none}
.tele b{color:var(--gold)}
.tele .me{color:var(--me)}

/* ---- 結果 ---- */
.podium{display:flex;align-items:flex-end;gap:7px;justify-content:center;margin:6px 0 14px}
.podium .p{flex:1;text-align:center;background:var(--panel);border:1px solid var(--line);border-radius:9px 9px 0 0;padding:8px 3px}
.podium .p.r1{border-color:var(--gold);padding-bottom:22px;background:var(--panel2)}
.podium .p .r{font-family:var(--f-num);font-size:17px;color:var(--gold)}
.podium .p .n{font-size:10.5px;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.podium .p .t{font-family:var(--f-num);font-size:9.5px;color:var(--dim2)}
.bigRank{text-align:center;margin:6px 0 4px}
.bigRank .v{font-family:var(--f-num);font-size:54px;font-weight:700;line-height:1;color:var(--gold)}
.bigRank .v.lose{color:var(--dim)}
.bigRank .u{font-size:13px;color:var(--dim);margin-left:3px}
.kv{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #1b2e23;font-size:12.5px}
.kv:last-child{border-bottom:0}
.kv .k{color:var(--dim)}
.kv .v{font-family:var(--f-num)}
.crown{display:flex;gap:6px;justify-content:center;margin:8px 0}
.crown .c{flex:1;text-align:center;padding:5px 2px;border-radius:8px;border:1px solid var(--line);background:var(--panel);font-size:10px;color:var(--dim2)}
.crown .c.won{border-color:var(--gold);background:linear-gradient(180deg,#30261240,#1d3327);color:var(--gold)}
.crown .c .ic{font-size:15px;line-height:1.2}
.title-badge{text-align:center;font-family:var(--f-ser);font-size:25px;letter-spacing:.14em;margin:4px 0 2px;
  background:linear-gradient(180deg,#fff6dc,#e8c268 50%,#a07a22);-webkit-background-clip:text;background-clip:text;color:transparent}
.scoreBig{text-align:center;font-family:var(--f-num);font-size:34px;font-weight:700;color:var(--gold);line-height:1.1}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#0a120ee8;border:1px solid var(--line2);
  color:var(--txt);padding:9px 16px;border-radius:20px;font-size:12px;z-index:50;pointer-events:none;
  opacity:0;transition:opacity .2s}
.toast.on{opacity:1}
.hall .h{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid #1b2e23;font-size:12px}
.hall .h .rk{font-family:var(--f-num);color:var(--gold);width:18px;flex:none}
.hall .h .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hall .h .sc{font-family:var(--f-num);color:var(--dim)}

/* ---- PC（マウス・広い画面）向け ---- */
@media (min-width:560px){
  body{background:radial-gradient(1100px 560px at 50% -8%, #14251c 0%, #070d0a 72%)}
  #app{border-left:1px solid var(--line); border-right:1px solid var(--line);
       box-shadow:0 0 70px rgba(0,0,0,.65)}
}
@media (hover:hover) and (pointer:fine){
  .styleCard,.chest,.odds .o,.tbl tr{cursor:default}
  .styleCard,.chest,.odds .o{cursor:pointer}
  .btn:hover{filter:brightness(1.13)}
  .btn.ghost:hover{border-color:var(--gold2);color:var(--txt)}
  .styleCard:hover{border-color:var(--line2)}
  .chest:hover{border-color:var(--line2);transform:translateY(-2px)}
  .odds .o:hover{filter:brightness(1.18)}

function rollStat(range){
  var lo=range[0], hi=range[1], c=(lo+hi)/2, a=(hi-lo)/2;
  var w=[], tot=0, v;
  for(v=lo; v<=hi; v++){
    var ww=Math.pow(a+1-Math.abs(v-c), 3);
    w.push(ww); tot+=ww;
  }
  var r=Math.random()*tot, acc=0, i;
  for(i=0;i<w.length;i++){ acc+=w[i]; if(r<=acc) return lo+i; }
  return c;
}

function randomHorseName(){
  return MOJIRI_NAMES[(Math.random()*MOJIRI_NAMES.length)|0];
}
function randomHorseNameUnique(used){
  var i, n;
  for(i=0;i<80;i++){
    n = MOJIRI_NAMES[(Math.random()*MOJIRI_NAMES.length)|0];
    if(!used[n]) return n;
  }
  for(i=0;i<80;i++){
    n = NAME_A[(Math.random()*NAME_A.length)|0] + NAME_B[(Math.random()*NAME_B.length)|0];
    if(n.length<=9 && !used[n]) return n;
  }
  return 'ホシノキセキ' + ((Math.random()*90+10)|0);
}

function fmtTime(t){
  if(!isFinite(t)) return '--:--.-';
  var m=Math.floor(t/60), s=t-m*60;
  return m+':'+(s<10?'0':'')+s.toFixed(1);
}
function fmtMoney(man){            /* 万円 → 「1億8000万円」 */
  if(man>=10000){
    var oku=Math.floor(man/10000), rest=man%10000;
    return oku+'億'+(rest?rest+'万':'')+'円';
  }
  return man+'万円';
}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}

/* コース地点情報を1mごとに前計算 */
function buildCourseLUT(c){
  if(c._lut) return c._lut;
  var n = Math.ceil(c.distance)+2, i, j, k;
  var corner = new Float32Array(n), elev = new Float32Array(n), grade = new Float32Array(n);
  var pos = 0, s;
  for(k=0;k<c.segments.length;k++){
    s = c.segments[k];
    var a = Math.round(pos), b = Math.round(pos+s.len);
    for(i=a;i<b&&i<n;i++) corner[i] = s.kind==='C' ? s.t : 0;
    pos += s.len;
  }
  var sm = new Float32Array(n), W = 25;
  for(i=0;i<n;i++){
    var sum=0, cnt=0;
    for(j=i-W;j<=i+W;j++){ if(j>=0&&j<n){ sum+=corner[j]; cnt++; } }
    sm[i]=sum/cnt;
  }
  corner.set(sm);
  var E = c.elev;
  for(i=0;i<n;i++){
    k=0; while(k<E.length-2 && E[k+1][0]<i) k++;
    var x0=E[k][0], y0=E[k][1], nx=Math.min(k+1,E.length-1);
    var x1=E[nx][0], y1=E[nx][1];
    var r = x1===x0 ? 0 : (i-x0)/(x1-x0);
    elev[i] = y0+(y1-y0)*Math.max(0,Math.min(1,r));
  }
  for(i=0;i<n;i++){
    var a2=Math.max(0,i-15), b2=Math.min(n-1,i+15);
    grade[i] = (elev[b2]-elev[a2])/(b2-a2)*100;
  }
  var lo=Infinity, hi=-Infinity;
  for(i=0;i<=c.distance;i++){ if(elev[i]<lo)lo=elev[i]; if(elev[i]>hi)hi=elev[i]; }
  c._lut = {corner:corner, elev:elev, grade:grade, elevMin:lo, elevMax:hi};
  return c._lut;
}

var PACE_STOPS = [0,0.14,0.45,0.70,0.88,1.0];
function paceAt(style,p){
  var a = STYLES[style].pace;
  var vals = [a[0],a[0],a[1],a[2],a[3],a[4]];
  for(var i=0;i<PACE_STOPS.length-1;i++){
    if(p<=PACE_STOPS[i+1]){
      var r=(p-PACE_STOPS[i])/(PACE_STOPS[i+1]-PACE_STOPS[i]||1);
      return vals[i]+(vals[i+1]-vals[i])*r;
    }
  }
  return vals[vals.length-1];
}

function makeRng(seed){
  var s=(seed>>>0)||1;
  return function(){ s^=s<<13; s>>>=0; s^=s>>>17; s^=s<<5; s>>>=0; return s/4294967296; };
}

/* 器用さから出遅れ確率を出す（F=約30% / S=約0.3%） */
function gateChance(skill){
  var x = (100-skill)/K.gateSpan;
  if(x<0) x=0; if(x>1) x=1;
  return K.gateP*Math.pow(x, K.gateExp);
}

/* レース全体を先に計算し、再生はその記録をなぞるだけにする */
function simulateRace(course, horses, seed){
  var lut = buildCourseLUT(course), rng = makeRng(seed);
  var dt = 0.1, D = course.distance, N = horses.length, Di = D|0;
  var st = [], i, j, k;
  for(i=0;i<N;i++){
    var h = horses[i], s = h.stats, sty = STYLES[h.style];
    var form = 1+(rng()-0.5)*K.formSpd, staForm = 1+(rng()-0.5)*K.formSta;
    var clum = 1-s.skill/100;
    var gate = (K.gateBase-K.gateSkill*s.skill/100)*(0.6+rng()*0.8), big=false;
    if(rng() < gateChance(s.skill)){ gate += 0.55+rng()*1.35*clum; big=true; }
    st.push({
      h:h, i:i, sty:sty, pos:0, v:0, e:0,
      vmax:(K.vBase+K.vSpeed*(s.speed/100))*form*(course.vScale||1),
      tank:(K.tankBase+K.tankSta*s.stamina)*staForm,
      gate:gate, bigGate:big, done:false, time:0, rank:0,
      trouble:0, troubleT:0, hadTrouble:false, troubleAt:0, maxRank:N, minRank:N,
      target:0, active:false
    });
  }

  var frames=[], ranks=[], t=0, finished=0, order=st.slice(), maxT=600;
  var allDoneT = -1;
  while((finished<N || t < allDoneT+RUN_OUT) && t<maxT){
    if(finished>=N && allDoneT<0) allDoneT = t;
    order.sort(function(a,b){return b.pos-a.pos;});
    var leadPos = order[0].pos, secondPos = order[1]?order[1].pos:leadPos;
    for(k=0;k<N;k++){
      var o = order[k];
      if(o.done){ o.v *= 0.9955; o.pos += o.v*dt; continue; }  /* ゴール板を駆け抜ける */
      if(t < o.gate) continue;
      var sx = o.h.stats, p = o.pos/D;
      var idx = o.pos<0?0:(o.pos>Di?Di:o.pos|0);
      var gr = lut.grade[idx], ct = lut.corner[idx];

      var effort = paceAt(o.h.style, p);
      if(p < 0.70){
        var posRatio = 1-k/(N-1), bd = o.sty.band;
        var off = posRatio<bd[0] ? bd[0]-posRatio : (posRatio>bd[1] ? bd[1]-posRatio : 0);
        /* 前に出るのは脚力しだいなので少ししか効かないが、控えるのは手綱で効く。
           ただし道中ずっと強く抑えると、器用さやパワーで出た差をその場で
           打ち消してしまい、コースごとの能力の効き方が消える。
           そこで強く抑えるのは序盤だけにして、K.holdTo から先は従来の効きに戻す。 */
        if(off>0) effort += Math.min(K.urge, off*0.085);
        else if(off<0){
          var hg = p<K.holdTo ? K.holdGain
                 : K.holdGain + (0.085-K.holdGain)*((p-K.holdTo)/(0.70-K.holdTo));
          effort += Math.max(-K.hold, off*hg);
        }
      }

      if(o.troubleT>0){ o.troubleT -= dt; }
      else {
        o.trouble = 0;
        if(p>0.08 && p<0.95 && rng() < K.troubleRate*(1.8-sx.skill/100)*o.sty.troubleMul){
          o.troubleT = 0.6+rng()*1.6;
          o.trouble = (0.06+rng()*0.12)*(1.5-sx.skill/100);
          if(!o.hadTrouble){ o.hadTrouble=true; o.troubleAt=o.pos; }
        }
      }

      var vr = o.v/K.burnRef; if(vr<0.3) vr=0.3;
      o.e += (Math.pow(vr,K.burnExp) + (gr>0 ? gr*K.hillBurn*(1-K.hillBurnPow*sx.power/100) : 0))*dt;
      var er = o.e/o.tank;
      var fade = er<=K.fadeFrom ? 1 : 1-K.fade*Math.min(1,(er-K.fadeFrom)/K.fadeSpan);

      var rem = D-o.pos;
      var slopeEff = gr>0 ? -gr*(K.slope-K.slopePow*sx.power/100) : -gr*K.downGain;
      var cornerLoss = ct*(K.corner-K.cornerSkill*sx.skill/100)*o.sty.cornerMul;

      var surge = 0;
      if(rem < K.surgeFrom){
        var q = Math.pow(1-rem/K.surgeFrom, 0.7);
        surge = (sx.power/100)*K.surge*q*o.sty.lateMul*(1-0.95*ct);
      }
      var duel=0, block=0;
      if(rem<500){
        for(j=0;j<N;j++){
          if(j===o.i) continue;
          var d1 = st[j].pos-o.pos;
          if(d1>-5 && d1<5){ duel=(sx.power/100)*K.duel; break; }
        }
      } else if(k>2){
        var ahead=0;
        for(j=0;j<N;j++){ var d2=st[j].pos-o.pos; if(d2>0&&d2<9) ahead++; }
        if(ahead>=3) block = K.block*(1-sx.skill/100)*o.sty.cornerMul;
      }

      /* 馬群の追走と、先頭の息入れ。残り chaseEnd m で効果が消え、直線だけが着差を決める */
      var chase = 0;
      var chScale = rem > K.chaseEnd ? 1 : rem/K.chaseEnd;
      if(chScale > 0){
        if(k === 0){
          var clear = o.pos - secondPos;
          if(clear > K.easeFrom) chase = -Math.min(K.easeMax, (clear-K.easeFrom)*K.easeGain);
        } else {
          var behind = leadPos - o.pos;
          if(behind > K.chaseFrom) chase = Math.min(K.chaseMax, (behind-K.chaseFrom)*K.chaseGain);
        }
        chase *= chScale;
      }
      if(chase > 0) o.e += chase*K.chaseBurn*dt;   /* 追走した分だけ余計に脚を使う */

      var target = o.vmax*effort*fade + slopeEff - cornerLoss + surge + duel - block + chase - o.trouble*o.vmax;
      o.target = target<5 ? 5 : target;
      o.active = true;
    }

    /* 馬群の圧縮：平均からのズレを縮め、着差を実際の競馬に近づける */
    var tSum=0, tN=0;
    for(i=0;i<N;i++){ if(st[i].active){ tSum+=st[i].target; tN++; } }
    var tMean = tN ? tSum/tN : 0;

    for(k=0;k<N;k++){
      var o2 = order[k];
      if(!o2.active) continue;
      o2.active = false;
      var tight = K.packTight, rem2 = D-o2.pos;
      if(rem2 < K.tightFrom){
        var tq = 1-rem2/K.tightFrom; if(tq>1) tq=1;
        tight = K.packTight + (K.tightEnd-K.packTight)*tq;
      }
      var tg = tMean + (o2.target-tMean)*tight;
      var dv = tg-o2.v;
      o2.v += dv>0 ? Math.min(dv, K.accel*dt*10) : Math.max(dv, -K.decel*dt*10);
      var prev = o2.pos;
      o2.pos += o2.v*dt;
      if(o2.pos>=D && !o2.done){ o2.time = t+dt*((D-prev)/(o2.pos-prev)); o2.done=true; finished++; }
    }
    var f = new Float32Array(N);
    for(i=0;i<N;i++) f[i]=st[i].pos;
    frames.push(f);
    var rk = new Uint8Array(N);
    for(k=0;k<N;k++){
      rk[order[k].i]=k+1;
      var oo=order[k];
      if(k+1<oo.minRank) oo.minRank=k+1;
      if(k+1>oo.maxRank||oo.maxRank===N) oo.maxRank=k+1;
    }
    ranks.push(rk);
    t += dt;
  }

  var res = st.slice().sort(function(a,b){
    return (a.done?a.time:9999+a.i)-(b.done?b.time:9999+b.i);
  });
  for(i=0;i<res.length;i++) res[i].rank=i+1;
  var winT = res[0].time;

  return {
    dt:dt, distance:D, frames:frames, ranks:ranks, frameCount:frames.length,
    winTime:winT,
    result: res.map(function(o){
      return {
        idx:o.i, horse:o.h, rank:o.rank, time:o.time,
        margin:o.time-winT, gateLoss:o.gate, bigGate:o.bigGate,
        hadTrouble:o.hadTrouble, troubleAt:o.troubleAt,
        fuelLeft:o.tank-o.e, minRank:o.minRank
      };
    })
  };
}

/* ---------- ライバル生成 ---------- */
function makeRival(name, style, total, uma){
  var b = STYLES[style].base, w = {}, sum = 0, kk;
  for(kk=0;kk<KEYS.length;kk++){
    var key = KEYS[kk];
    w[key] = (b[key]/170)*(1+(Math.random()-0.5)*0.34);
    sum += w[key];
  }
  var stats = {};
  for(kk=0;kk<KEYS.length;kk++){
    var key2 = KEYS[kk];
    stats[key2] = Math.max(20, Math.min(100, Math.round(total*w[key2]/sum)));
  }
  return {name:name, style:style, stats:stats, uma:uma, isMe:false};
}

/* 有真記念に毎年やってくる顔ぶれ。脚質も強さも毎回変わるが、常に上位を争う格 */
var ARIMA_GUESTS = ['チョーシンフジタ','テンサイバケンシ','マジシャンミズノ','サスガニステーキ'];
var GUEST_MIN = 11, GUEST_MAX = 35;

function buildField(courseKey, me){
  var pow = RIVAL_POWER[courseKey], jit = RIVAL_JIT;
  if(courseKey === 'arima'){
    /* 有真記念だけは「三冠馬の格に見合う相手」が集まる。
       三冠馬の能力は328〜400と幅があり、固定の強さだと惨敗か楽勝のどちらかになるため。
       それでも強い馬ほど有利になるよう、相手の伸びは本人の伸びより緩やかにしてある。 */
    var tot = 0, q;
    for(q=0;q<KEYS.length;q++) tot += me.stats[KEYS[q]];
    pow = ARIMA_BASE + ARIMA_SLOPE*tot;
    if(pow < ARIMA_MIN) pow = ARIMA_MIN;
    if(pow > ARIMA_MAX) pow = ARIMA_MAX;
    jit = ARIMA_JIT;
  }
  var used = {}, list = [], i;
  used[me.name] = 1;
  var nRand = 17;
  if(courseKey === 'arima'){
    for(i=0;i<ARIMA_GUESTS.length;i++){
      used[ARIMA_GUESTS[i]] = 1;
      list.push(makeRival(ARIMA_GUESTS[i],
        STYLE_ORDER[(Math.random()*3)|0],
        pow + GUEST_MIN + Math.random()*(GUEST_MAX-GUEST_MIN), 0));
    }
    nRand = 17-ARIMA_GUESTS.length;
    pow -= 12;
  }
  for(i=0;i<nRand;i++){
    var nm = randomHorseNameUnique(used);
    used[nm]=1;
    var sty = STYLE_ORDER[i%3];
    list.push(makeRival(nm, sty, pow+(Math.random()-0.5)*2*jit, 0));
  }
  for(i=list.length-1;i>0;i--){
    var sw=(Math.random()*(i+1))|0, tmp=list[i]; list[i]=list[sw]; list[sw]=tmp;
  }
  var slot = (Math.random()*18)|0;
  list.splice(slot, 0, me);
  for(i=0;i<18;i++){ list[i].uma = i+1; list[i].waku = wakuOf(i+1); }
  return list;
}

/* 全能力99以上の完成馬かどうか */
function isPerfectHorse(h){
  for(var i=0;i<KEYS.length;i++) if(h.stats[KEYS[i]] < 99) return false;
  return true;
}

/* 能力から単勝オッズと人気を作る（実際の単勝らしい分布になるよう圧縮） */
var ODDS_Z0 = 1.5, ODDS_ZC = 3.2;   /* 評価差の素通し幅と頭打ち */
function makeOdds(field, course){
  var i, v=[], mean=0;
  var wSta = course.distance>=2800?1.25:(course.distance>=2400?0.70:0.42);
  for(i=0;i<field.length;i++){
    var s=field[i].stats;
    v.push(s.speed*1.00 + s.power*0.62 + s.skill*0.58 + s.stamina*wSta);
    mean+=v[i];
  }
  mean/=field.length;
  var w=[], tot=0;
  for(i=0;i<field.length;i++){
    /* 世間の評価は完璧ではない（±の読み違い）を少し混ぜる */
    var noise=(Math.random()-0.5)*4.0;
    var z=(v[i]-mean+noise)/9.0;
    /* 抜けた馬がいても他馬の評価を0に潰さない。
       ODDS_Z0 までは素通し、そこから上下は ODDS_ZC へなめらかに頭打ちさせる。
       これをしないと単勝が「1.1 と 999 が並ぶ」ありえない板になる。 */
    var ab=z<0?-z:z;
    if(ab>ODDS_Z0){
      ab = ODDS_Z0 + (ODDS_ZC-ODDS_Z0)*Math.tanh((ab-ODDS_Z0)/(ODDS_ZC-ODDS_Z0));
      z = z<0?-ab:ab;
    }
    w.push(Math.exp(z));
    tot+=w[i];
  }
  var arr=[];
  for(i=0;i<field.length;i++){
    var pr=w[i]/tot;
    var odds=0.80/pr;
    odds = odds<1.1?1.1:(odds>999?999:odds);
    arr.push({i:i, pr:pr, odds:Math.round(odds*10)/10});
  }
  var sorted=arr.slice().sort(function(a,b){return b.pr-a.pr;});
  for(i=0;i<sorted.length;i++){
    field[sorted[i].i].ninki=i+1;
    field[sorted[i].i].odds=sorted[i].odds;
  }
  return field;
}

/* ---------------- 画面切替 ---------------- */
show:function(n){
  var ss = document.querySelectorAll('.screen'), i;
  for(i=0;i<ss.length;i++) ss[i].classList.remove('on');
  var el = $('s-'+n); if(el){ el.classList.add('on'); el.scrollTop = 0; }
  window.scrollTo(0,0);
  if(n==='hall') this.renderHall();
  if(n==='howto') this.renderHowto();
  BGM.forScreen(n, this);
},
toggleBgm:function(){ BGM.setOn(!BGM.on); this.syncBgmBtn(); },
syncBgmBtn:function(){
  var b=$('bgmBtn'); if(!b) return;
  b.className = 'bgmBtn' + (BGM.on?' on':' off');
  b.setAttribute('aria-label', BGM.on?'音楽を止める':'音楽を鳴らす');
},
toast:function(msg){
  var t=$('toast'); t.textContent=msg; t.classList.add('on');
  clearTimeout(this._tt); this._tt=setTimeout(function(){t.classList.remove('on');},1500);
},

confirmHorse:function(){
  var nm = ($('hname').value||'').trim();
  if(!nm){ $('nameMsg').textContent='馬名を入力してください'; $('nameMsg').style.color='var(--red)'; return; }
  if(!/^[ァ-ヶー]+$/.test(nm)){
    $('nameMsg').textContent='カタカナと長音符（ー）のみ使えます';
    $('nameMsg').style.color='var(--red)'; return;
  }
  if(nm.length>9){ $('nameMsg').textContent='９文字以内にしてください'; $('nameMsg').style.color='var(--red)'; return; }
  this.saveLastName(nm);
  var rg = STYLES[this.selStyle].range, stats = {}, born = {}, i2;
  for(i2=0;i2<KEYS.length;i2++){
    var kk = KEYS[i2];
    stats[kk] = born[kk] = rollStat(rg[kk]);     /* ここで素質が決まる */
  }
  this.horse = {name:nm, style:this.selStyle, isMe:true, stats:stats, born:born};
  this.startTraining();
},

/* ---------------- 育成 ---------------- */
startTraining:function(){
  var isFinal = (this.raceIdx===3);
  var base = BASE_POINTS + this.bonus;
  this.tr = {
    phase:'hl', base:base, bonus:this.bonus,
    round:0, rounds:isFinal?1:(HL_ROUNDS[this.raceIdx]||1), acc:0, streak:0,
    shown:0, hidden:0, locked:false, result:null, total:base,
    alloc:{speed:0,power:0,stamina:0,skill:0}, step:5, isFinal:isFinal,
    confirmLeft:false
  };
  var nx = this.nextCourse();
  this.tr.title = isFinal ? '最終調整' : '育成';
  this.tr.nextName = nx.name;
  this.show('train');
  this.newRound();
},
nextCourse:function(){ return COURSES[this.raceIdx<3 ? RACE_ORDER[this.raceIdx] : 'arima']; },

renderTrain:function(){
  if(this.tr.phase==='hl') this.renderHL(); else this.renderAlloc();
},

/* --- ハイアンドロー --- */
newRound:function(){
  var t=this.tr;
  t.acc=0; t.streak=0; t.pick=null; t.locked=false; t.result=null;
  t.shown = 2+((Math.random()*8)|0);
  t.hidden = 0;
  this.renderHL();
},
hlOdds:function(){
  var x=this.tr.shown;
  return {hi:{k:10-x, p:(10-x)/9}, lo:{k:x-1, p:(x-1)/9}};
},
/* 的中率から競馬らしい呼び名をつける */
riskName:function(p){
  if(p>=0.75) return {t:'本命', c:'#9fe8b4'};
  if(p>=0.60) return {t:'対抗', c:'#cfe8a8'};
  if(p>=0.45) return {t:'五分', c:'#e8d9a8'};
  if(p>=0.30) return {t:'穴',   c:'#f0b07a'};
  return {t:'大穴', c:'#ff9ad5'};
},
renderHL:function(){
  var t=this.tr, o=this.hlOdds(), h='', i;
  var mul = hlMult(t.streak);
  var gHi = Math.round(HL_PTS[o.hi.k]*mul), gLo = Math.round(HL_PTS[o.lo.k]*mul);
  var rHi = this.riskName(o.hi.p), rLo = this.riskName(o.lo.p);
  var shown = t.result ? (t.result==='lose'?'miss':'hit') : '';

  h+='<div class="ornHead" style="margin:0 0 0">'
    +svg('crown',20,'var(--gold)')
    +'<div class="h"><i></i><div class="t" style="font-size:19px">'+t.title+'</div><i></i></div>'
    +'<div class="s">ROUND '+(t.round+1)+' / '+t.rounds+'</div>'
    +'</div>';
  h+='<div class="roundPips">';
  for(i=0;i<t.rounds;i++) h+='<i class="'+(i<t.round?'on':(i===t.round?'cur':''))+'"></i>';
  h+='</div>';

  h+='<div class="orn hlStage">'
    +'<span class="cn tl"></span><span class="cn tr"></span>'
    +'<span class="cn bl"></span><span class="cn br"></span>';

  h+='<div class="hlMeta" style="margin-top:2px">確定済み <b>'+t.total+'</b></div>';

  /* 場の2枚 */
  h+='<div class="cardRow">'
    +'<div class="pcard2'+(t.result?' '+shown:'')+'">'
    +'<span class="cnr a">'+t.shown+'</span><span class="big">'+t.shown+'</span>'
    +'<span class="cnr b">'+t.shown+'</span></div>'
    +'<div class="vsMark">VS</div>'
    +'<div class="pcard2 back'+(t.result?' open '+shown:'')+'">'
    +(t.result?'<span class="cnr a">'+t.hidden+'</span>':'')
    +'<span class="big">'+(t.result?t.hidden:'?')+'</span>'
    +(t.result?'<span class="cnr b">'+t.hidden+'</span>':'')
    +'</div></div>'
    +'<div class="cardCap"><span>オモテの札</span><i></i><span>ウラの札</span></div>';

  /* 上乗せ */
  var bust = (t.result==='lose');
  h+='<div class="pot2"><div class="lab">このラウンドの上乗せ</div>'
    +'<div class="v'+(bust||t.acc===0?' zero':'')+'">'+(bust?0:t.acc)+'</div>';
  if(t.streak>0 && !t.result){
    var stars=''; for(i=0;i<Math.min(t.streak,5);i++) stars+='★';
    h+='<div class="streak"><span class="stars">'+stars+'</span>'
      +t.streak+'連続的中　次の倍率 <span class="mul">×'+hlMult(t.streak).toFixed(1)+'</span></div>';
  }
  h+='</div>';
  /* もう振りようがない状態なら、稼いだぶんの行き先をここで伝えておく */
  if(this.allocRoom()<=0){
    h+='<div class="capNote">全能力が上限に達しています。<br>'
      +'余ったポイントは、最終スコアに加算されます。</div>';
  }

  if(!t.result){
    h+='<div class="betRow">'
      +'<div class="bet hi" onclick="G.hlPick(\'hi\')">'
      +'<div class="dir">HIGH ↑</div>'
      +'<div class="risk" style="color:'+rHi.c+'">'+rHi.t+'</div>'
      +'<div class="gauge"><i style="width:'+(o.hi.p*100).toFixed(0)+'%;background:#e2574c"></i></div>'
      +'<div class="pct">的中 '+Math.round(o.hi.p*100)+'%</div>'
      +'<div class="pay">＋'+gHi+'</div></div>'
      +'<div class="bet lo" onclick="G.hlPick(\'lo\')">'
      +'<div class="dir">LOW ↓</div>'
      +'<div class="risk" style="color:'+rLo.c+'">'+rLo.t+'</div>'
      +'<div class="gauge"><i style="width:'+(o.lo.p*100).toFixed(0)+'%;background:#5aa9e6"></i></div>'
      +'<div class="pct">的中 '+Math.round(o.lo.p*100)+'%</div>'
      +'<div class="pay">＋'+gLo+'</div></div>'
      +'</div>'
      +'<div class="hlMeta" style="margin:11px 0 0">裏の札は 1〜10（'+t.shown+'は出ません）。薄いほうほど配当が高い。</div>'
      +'</div>';
    if(t.streak>0){
      h+='<button class="cashBtn" onclick="G.hlStop()">'+svg('dia',13)
        +'ここでやめて ＋'+t.acc+' を確定する</button>'
        +'<div class="hlWarn">失敗するとこのラウンドの上乗せは全て消えます<br>'
        +'（元手の '+t.total+' は残ります）</div>';
    }
  } else if(t.result==='hit'){
    h+='<div class="hlResult" style="color:var(--gold)">的中！</div></div>';
  } else {

    h+='<div class="hlResult" style="color:'+(win?'var(--gold)':'#e2574c')+'">'
      +(win?'＋'+t.acc+' を確定':'失敗')+'</div>';
    if(win) h+='<div class="hlAnswer">裏の札は <b style="color:var(--txt)">'+t.hidden+'</b> でした。'
      +'<b style="color:'+(t.wouldBe==='HIGH'?'#ff8b7f':'#8ccaf5')+'">'+t.wouldBe+'</b> なら的中。</div>';
    else h+='<div class="hlAnswer">上乗せは消えました。元手の '+t.total+' は残ります。</div>';
    h+='</div>';
    h+='<button class="btnOrn" onclick="G.hlNext()">'
      +(t.round+1>=t.rounds?'能力の振り分けへ':'ラウンド'+(t.round+2)+'へ')+'</button>';
  }
  h += this.statusPanel();
  if(t.giveUp){
    h+='<div class="giveUpBox"><p>この馬の育成をあきらめます。<br>'
      +'ここまでの育成とレースの記録は残りません。</p>'
      +'<div class="row"><button class="no" onclick="G.giveUpCancel()">続ける</button>'
      +'<button class="yes" onclick="G.giveUpDo()">あきらめる</button></div></div>';
  } else {
    h+='<button class="giveUp" onclick="G.giveUpAsk()">育成をあきらめる</button>';
  }
  $('trBody').innerHTML=h;
},
hlPick:function(side){
  var t=this.tr; if(t.locked||t.result) return;
  t.locked=true;
  var pool=[],i;
  for(i=1;i<=10;i++) if(i!==t.shown) pool.push(i);
  t.hidden = pool[(Math.random()*pool.length)|0];
  var win = side==='hi' ? (t.hidden>t.shown) : (t.hidden<t.shown);
  var o=this.hlOdds(), k = side==='hi'?o.hi.k:o.lo.k;
  if(win){
    t.acc += Math.round(HL_PTS[k]*hlMult(t.streak));
    t.streak++;
    t.result='hit';
    BGM.cue('yay', 0, 0.26);
    this.renderHL();
    var self=this;
    setTimeout(function(){
      if(self.tr!==t || t.result!=='hit') return;
      t.result=null; t.locked=false;
      t.shown = t.hidden<2?2:(t.hidden>9?9:t.hidden);
      self.renderHL(); self.flashCards();
    }, 900);
  } else {
    t.result='lose'; t.acc=0;
    BGM.cue('aww', 0, 0.32);
    this.renderHL();
  }
},
flashCards:function(){
  var c=document.querySelectorAll('#trBody .pcard'),i;
  for(i=0;i<c.length;i++){ c[i].classList.remove('flip'); void c[i].offsetWidth; c[i].classList.add('flip'); }
},
hlStop:function(){
  var t=this.tr; if(t.locked||t.result) return;
  t.total += t.acc;
  var pool=[],i;
  for(i=1;i<=10;i++) if(i!==t.shown) pool.push(i);
  t.hidden = pool[(Math.random()*pool.length)|0];
  t.wouldBe = t.hidden>t.shown ? 'HIGH' : 'LOW';
  t.result='win';
  this.renderHL();
},
hlNext:function(){
  var t=this.tr;
  /* 的中の演出中は自動で次へ繋がるので、ここでは何もしない（上乗せを失わないため） */
  if(t.result==='hit') return;
  t.round++;
  if(t.round>=t.rounds){ t.phase='alloc'; this.renderAlloc(); }
  else this.newRound();
},

/* --- 振り分け --- */
allocLeft:function(){
  var t=this.tr, u=0, i;
  for(i=0;i<KEYS.length;i++) u+=t.alloc[KEYS[i]];
  return t.total-u;
},
/* まだ振り分けられる余地（全能力が100ならゼロ） */
allocRoom:function(){
  var t=this.tr, s=this.horse.stats, r=0, i;
  for(i=0;i<KEYS.length;i++){
    var v=s[KEYS[i]]+t.alloc[KEYS[i]];
    if(v<100) r += 100-v;
  }
  return r;
},
renderAlloc:function(){
  var t=this.tr, s=this.horse.stats, left=this.allocLeft(), h='', i;
  /* 現在の能力＝確定分＋いま振り分けている分。振るたびに上の表も動く */
  function cur(k){ return Math.min(100, s[k]+t.alloc[k]); }
  /* 確認を出したまま振り切った場合は確認を引っ込める */
  if(t.confirmLeft && left<=0) t.confirmLeft=false;

  h+='<div class="card"><div class="sec">STEP 2 ・ 獲得ポイントを振り分ける</div>'
    +'<div class="potLine"><div class="pot2 inline"><div class="lab">のこり</div>'
    +'<div class="v'+(left<=0?' zero':'')+'">'+left+'</div></div>'
    +'<div class="steps">';
  [1,5,10].forEach(function(v){
    h+='<button class="btn ghost sm" style="width:54px;padding:7px 0'
      +(t.step===v?';border-color:var(--gold);color:var(--gold)':'')+'" onclick="G.setStep('+v+')">±'+v+'</button>';
  });
  h+='</div></div></div>';

  /* 左が抽選で決まった初期値、右が現在の能力。伸びた分が一目で分かる */
  if(this.horse.born){
    var b0=0, c0=0;
    h+='<div class="card"><div class="sec">この馬の能力</div>'
      +'<div class="grow"><div class="gh"><span></span><span>初期値</span><span></span><span>現在</span></div>';
    for(i=0;i<KEYS.length;i++){
      var bk=KEYS[i], bv=this.horse.born[bk], cv=cur(bk);
      b0+=bv; c0+=cv;
      h+='<div class="gr"><span class="n">'+SNAME[bk]+'</span>'
        +'<span class="a"><b class="g-'+grade(bv)+'">'+grade(bv)+'</b>'+bv+'</span>'
        +'<span class="ar">→</span>'
        +'<span class="b'+(cv>bv?' up':'')+'"><b class="g-'+grade(cv)+'">'+grade(cv)+'</b>'+cv+'</span></div>';
    }
    h+='<div class="gr tot"><span class="n">合計</span>'
      +'<span class="a">'+b0+'</span><span class="ar">→</span>'
      +'<span class="b'+(c0>b0?' up':'')+'">'+c0+'</span></div></div></div>';
  }

  h+='<div class="card">';
  for(i=0;i<KEYS.length;i++){
    var k=KEYS[i], base=s[k], add=t.alloc[k], tot=Math.min(100,base+add), g=grade(tot);
    h+='<div class="alloc">'
      +'<div class="lb">'+SNAME[k]+'</div>'
      +'<div class="bar"><i style="width:'+base+'%"></i>'
      +'<u style="left:'+base+'%;width:'+(tot-base)+'%"></u></div>'
      +'<div class="val"><span class="g-'+g+'">'+g+'</span> '+tot+(add?'<span style="color:var(--gold)"> +'+add+'</span>':'')+'</div>'
      +'<div class="pm">'
      +'<button '+(add<=0?'disabled':'')+' onclick="G.adj(\''+k+'\',-1)">−</button>'
      +'<button '+(left<=0||tot>=100?'disabled':'')+' onclick="G.adj(\''+k+'\',1)">＋</button>'
      +'</div></div>';
  }
  h+='<div class="row" style="margin-top:4px">'
    +'<button class="btn ghost sm" onclick="G.allocAuto()">おまかせ</button>'
    +'<button class="btn ghost sm" onclick="G.allocReset()">リセット</button></div>';
  h+='</div>';

  /* 次走。求められる力は順位つきの札にして、何を伸ばすかを即断できるようにする。
     ポイント余りの確認が出ているあいだは、画面に収めるためこの札を省く */
  if(!t.confirmLeft){
  var nx=this.nextCourse(), hp=nx.hint.split('：');
  var toks=(hp[1]||'').split(/\s+/), j, first=true;
  h+='<div class="card nextRace">'
    +'<div class="nrTop"><span class="lb">次走</span><span class="nm">'+nx.name+'</span>'
    +'<span class="cd">'+nx.track+'　'+nx.surface+nx.distance+'m　'+nx.grade+'</span></div>'
    +'<div class="nrLab">'+(hp[0]||'求められる力')+'</div><div class="chips">';
  for(j=0;j<toks.length;j++){
    var tk=toks[j]; if(!tk) continue;
    if(tk==='＞'||tk==='≫'||tk==='>') h+='<i>'+tk+'</i>';
    else { h+='<b'+(first?' class="top"':'')+'>'+tk+'</b>'; first=false; }
  }
  h+='</div></div>';
  }

  var stuck = (left>0 && this.allocRoom()<=0);
  if(stuck){
    h+='<div class="card tight ctr" style="border-color:var(--gold2)">'
      +'<div style="font-family:var(--f-ser);font-size:15px;color:var(--gold)">全能力が上限に達しました</div>'
      +'<div class="tiny" style="margin-top:3px">これ以上は伸びません。'
      +'余った '+left+' ポイントは<b style="color:var(--gold)">最終スコアに加算</b>されます。</div></div>';
  }
  /* 振り残しがあっても進める。ただし一度だけ確かめる */
  if(t.confirmLeft){
    h+='<div class="giveUpBox ask"><p>ポイントが <b>'+left+'</b> 余っています。<br>'
      +'このまま次へ進んでいいですか？</p>'
      +'<div class="row"><button class="no" onclick="G.allocBack()">振り分けに戻る</button>'
      +'<button class="yes" onclick="G.finishAlloc()">このまま進む</button></div></div>';
  } else {
    h+='<button class="btn gold stick" onclick="G.finishAllocAsk()">出走へ進む</button>';
  }
  $('trBody').innerHTML=h;
},
setStep:function(v){ this.tr.step=v; this.renderAlloc(); },
adj:function(k,dir){
  var t=this.tr, s=this.horse.stats, left=this.allocLeft();
  var step=t.step;
  if(dir>0){
    var room=Math.min(left, 100-(s[k]+t.alloc[k]));
    t.alloc[k]+=Math.min(step,room);
  } else {
    t.alloc[k]-=Math.min(step,t.alloc[k]);
  }
  this.renderAlloc();
},
allocReset:function(){ var t=this.tr,i; for(i=0;i<KEYS.length;i++) t.alloc[KEYS[i]]=0; this.renderAlloc(); },
allocAuto:function(){
  var t=this.tr, s=this.horse.stats, i;
  for(i=0;i<KEYS.length;i++) t.alloc[KEYS[i]]=0;
  var left=t.total, guard=0;
  while(left>0 && guard++<4000){
    var lowK=null, lowV=999;
    for(i=0;i<KEYS.length;i++){
      var k=KEYS[i], v=s[k]+t.alloc[k];
      if(v<100 && v<lowV){ lowV=v; lowK=k; }
    }
    if(!lowK) break;
    t.alloc[lowK]++; left--;
  }
  this.renderAlloc();
},
finishAllocAsk:function(){
  /* 上限に達していて振りようがない場合は確認しない */
  if(this.allocLeft()>0 && this.allocRoom()>0){ this.tr.confirmLeft=true; this.renderAlloc(); return; }
  this.finishAlloc();
},
allocBack:function(){ this.tr.confirmLeft=false; this.renderAlloc(); },
finishAlloc:function(){
  var t=this.tr, s=this.horse.stats, i;
  /* 振りようがなくて余ったぶんだけ、最終スコアに回す。
     自分の意思で残したぶん（確認を押して進んだ場合）は対象にしない。 */
  var left=this.allocLeft(), stuck=(this.allocRoom()<=0);
  if(left>0 && stuck) this.spare=(this.spare||0)+left;
  for(i=0;i<KEYS.length;i++){ var k=KEYS[i]; s[k]=Math.min(100,s[k]+t.alloc[k]); }
  this.prepareRace();
},

/* 枠に収めた表で、目的の行が見える位置までスクロールする。
   center=true なら枠の中央に、false なら足りない分だけ送る（上位から見せたい表向き）。*/
scrollRowInto:function(wrap, row, center){
  if(!wrap || !row) return;
  var top = row.getBoundingClientRect().top - wrap.getBoundingClientRect().top + wrap.scrollTop;
  var bot = top + row.offsetHeight;
  if(center){ wrap.scrollTop = Math.max(0, top - wrap.clientHeight/2 + row.offsetHeight/2); return; }
  if(top < wrap.scrollTop) wrap.scrollTop = top;
  else if(bot > wrap.scrollTop + wrap.clientHeight) wrap.scrollTop = bot - wrap.clientHeight;
},

    +(buildCourseLUT(c).elevMax-buildCourseLUT(c).elevMin).toFixed(1)+'m</div></div></div>'

  }

  this.show('entry');
  /* 18頭いるので、自分の馬が枠の真ん中に来た状態で開く */
  var wrap=$('enTable');

/* ---------------- レース後 ---------------- */
afterRace:function(){
  var r=this.lastRace;
  this.bonus = RANK_BONUS[r.rank]||0;
  if(this.raceIdx===3){ this.finalResult(); return; }
  this.raceIdx++;
  if(this.raceIdx<3){ this.startTraining(); return; }
  if(this.crowns===3){ this.startTraining(); }   /* 三冠達成 → 最終調整 → 有真記念 */
  else this.finalResult();
},

/* ---------------- 最終リザルト ---------------- */
finalResult:function(){
  var i, h='', s=this.horse.stats;
  var four = !!this.arimaWon;
  var cw = Math.min(3, this.crowns);
  var ttl = four?'四冠王':(cw===3?'三冠馬':(cw===2?'二冠馬':(cw===1?'クラシックホース':null)));
  if(!ttl){
    var best=99;
    for(i=0;i<this.history.length;i++) best=Math.min(best,this.history[i].rank);
    ttl = best<=3?'善戦の名脇役':(best<=5?'掲示板の常連':'無冠の馬');
  }
  var score=this.calcScore(four);

  h+='<div class="ctr" style="padding-top:14px">'
    +'<div class="tiny" style="letter-spacing:.3em">FINAL RESULT</div>'
    +'<div class="title-badge">'+ttl+'</div>'
    +'<div style="font-family:var(--f-ser);font-size:23px;letter-spacing:.14em;margin:2px 0 4px">'+esc(this.horse.name)+'</div>'
    +'<div class="tiny">'+STYLES[this.horse.style].label+'</div></div>';

  h+='<div class="crown">';
  var cr=[['satsuki','早月賞'],['derby','日本クラウン'],['kikka','菊華賞'],['arima','有真記念']];
  for(i=0;i<cr.length;i++){
    var rec=null,j;
    for(j=0;j<this.history.length;j++) if(this.history[j].key===cr[i][0]) rec=this.history[j];
    var won = rec && rec.rank===1;
    h+='<div class="c'+(won?' won':'')+'"><div class="ic">'+(won?'👑':(rec?rec.rank+'着':'—'))+'</div>'+cr[i][1]+'</div>';
  }

  var rk=0, tm=0, i;

    var r=this.history[i];
    rk += r.rank===1?3000:(r.rank===2?1500:(r.rank===3?900:(r.rank<=5?400:(r.rank<=10?150:50))));
    var std=STD_TIME[r.key]||r.time;
    tm += Math.max(0, Math.round((std-r.time)*300));
  }
  var st=0;
  for(i=0;i<KEYS.length;i++) st+=this.horse.stats[KEYS[i]];
  st*=12;
  /* 上限で振れなかったポイントは、能力1と同じ重みで拾う（カンストが損にならないように） */

  var mn = Math.round(this.prize/50);
  var bn = four?30000:(this.crowns>=3?12000:(this.crowns===2?3000:0));
  return {rank:rk, time:tm, stat:st, spare:sp, money:mn, bonus:bn,
          total:rk+tm+st+sp+mn+bn};
},
